name: tests

# Every push and every pull request. A suite that runs when someone remembers
# is a suite that is green when someone remembers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push supersedes the first: nobody needs the result for a commit
  # that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # The first import of the embedding model downloads ~470MB. Caching it on
      # the pinned fastembed version and model name turns a minute of every run
      # into a few seconds, and makes the run independent of a third party
      # being up.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2-${{ hashFiles('requirements.txt') }}

      - name: Lint
        run: |
          pip install ruff==0.15.4
          ruff check sanwaad tests

      - name: Test
        # No API key is set, on purpose. The suite must pass offline or it is
        # testing the model rather than the system around it.
        run: pytest tests/ -q

      # The evals are the claim the README makes, so CI makes it too rather
      # than trusting a number someone pasted in once.
      - name: Trajectory eval
        run: python -m sanwaad.evals.trajectory

      - name: Loop eval
        run: python -m sanwaad.evals.loop_eval

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t sanwaad:ci .

      # Building proves it compiles; only starting it proves it runs. The probe
      # is the contract a deployment depends on, so the container has to answer
      # it before the image is called good.
      - name: Boot and probe
        run: |
          docker run -d --name sanwaad-ci -p 7870:7870 sanwaad:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7870/ready > /dev/null; then
              echo "ready after ${i}s"
              curl -sS http://localhost:7870/ready
              docker rm -f sanwaad-ci
              exit 0
            fi
            sleep 1
          done
          echo "never became ready"
          docker logs sanwaad-ci
          exit 1
