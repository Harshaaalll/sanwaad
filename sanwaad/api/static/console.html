function hbars(obj) {
  const entries = Object.entries(obj || {});
  const max = Math.max(1, ...entries.map(([, n]) => n));
  return entries.map(([k, n]) => `<div class="hbar"><span>${esc(k)}</span>
    <div style="width:${n / max * 100}%"></div><span>${n}</span></div>`).join("") || '<p class="muted">—</p>';
}

// --- Charts: inline SVG, no library. Specs from the dataviz method: 2px lines,
// >=8px end dots with a surface ring, hairline grid, legend + end labels for two
// series, a crosshair tooltip, and a table view so nothing is colour-only.

const fmtDay = iso => new Date(iso + "T00:00:00").toLocaleDateString(undefined, {day: "numeric", month: "short"});
const minutes = m => m == null ? "—" : m < 60 ? `${Math.round(m)} min` : m < 1440 ? `${(m / 60).toFixed(1)} h` : `${(m / 1440).toFixed(1)} d`;

function niceMax(v) {
  if (v <= 4) return 4;
  const step = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 4, 5, 6, 8, 10]) if (m * step >= v) return m * step;
  return 10 * step;
}

function sparkline(values, label) {
  const w = 120, h = 32, max = Math.max(1, ...values), n = values.length;
  const x = i => 4 + i * (w - 8) / Math.max(1, n - 1), y = v => h - 5 - v * (h - 10) / max;
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}">
    <polyline points="${pts}" fill="none" stroke="var(--muted-mark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n - 1)}" cy="${y(values[n - 1])}" r="4" fill="var(--s1)" stroke="var(--panel)" stroke-width="2"/></svg>`;
}

function volumeChart(t, width) {
  const series = [{key: "opened", label: "Opened", color: "var(--s1)"}, {key: "resolved", label: "Resolved", color: "var(--s2)"}];
  const W = Math.max(300, width), H = 230, L = 34, R = 92, T = 12, B = 28;
  const n = t.days.length, max = niceMax(Math.max(...t.opened, ...t.resolved));
  const x = i => L + i * (W - L - R) / (n - 1), y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 4, max / 2, 3 * max / 4, max].filter(v => Number.isInteger(v));
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" class="axis">${v}</text>`).join("");
  const labelAt = [0, Math.floor((n - 1) / 2), n - 1];
  const xlabels = labelAt.map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}"
    class="axis">${i === n - 1 ? "Today" : fmtDay(t.days[i])}</text>`).join("");
  // End labels, nudged apart only when they would overlap.
  let ends = series.map(s => ({...s, v: t[s.key][n - 1], y: y(t[s.key][n - 1])}));
  if (Math.abs(ends[0].y - ends[1].y) < 14) { const mid = (ends[0].y + ends[1].y) / 2; ends[0].y = mid - 8; ends[1].y = mid + 8; }
  const lines = series.map(s => `<polyline points="${t[s.key].map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"
      fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n - 1)}" cy="${y(t[s.key][n - 1])}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`).join("");
  const endLabels = ends.map(e => `<text x="${x(n - 1) + 10}" y="${e.y + 4}" class="endlabel">${e.label} ${e.v}</text>`).join("");
  return `<svg id="vol-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Complaints opened and resolved per day, last ${n} days">
    ${grid}${xlabels}${lines}${endLabels}
    <line id="vol-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
    <rect id="vol-hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"
      data-l="${L}" data-step="${(W - L - R) / (n - 1)}"/></svg>`;
}

function bindVolumeHover(t) {
  const hit = document.getElementById("vol-hit"), cross = document.getElementById("vol-cross");
  if (!hit || !hit.addEventListener) return;
  const tip = document.getElementById("viz-tip");
  const at = e => {
    const box = hit.ownerSVGElement.getBoundingClientRect();
    const sx = (e.clientX - box.left) * (hit.ownerSVGElement.viewBox.baseVal.width / box.width);
    return Math.max(0, Math.min(t.days.length - 1, Math.round((sx - Number(hit.dataset.l)) / Number(hit.dataset.step))));
  };
  hit.addEventListener("mousemove", e => {
    const i = at(e), cx = Number(hit.dataset.l) + i * Number(hit.dataset.step);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${i === t.days.length - 1 ? "Today" : fmtDay(t.days[i])}</b>
      <span><i style="background:var(--s1)"></i>Opened ${t.opened[i]}</span>
      <span><i style="background:var(--s2)"></i>Resolved ${t.resolved[i]}</span>`;
    tip.hidden = false;
    tip.style.left = `${Math.min(innerWidth - 170, e.clientX + 14)}px`; tip.style.top = `${e.clientY + 14}px`;
  });
  hit.addEventListener("mouseleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
}

function momentumHtml(rows) {
  if (!rows.length) return '<p class="muted" style="margin:0">No complaints in the last two weeks.</p>';
  const max = Math.max(1, ...rows.map(r => r.this_week));
  return `<div class="momentum">${rows.slice(0, 8).map(r => {
    const dir = r.change > 0 ? `<span class="delta up" title="More than last week">▲ ${r.change}</span>`
      : r.change < 0 ? `<span class="delta down" title="Fewer than last week">▼ ${-r.change}</span>`
      : '<span class="delta flat">no change</span>';
    return `<div class="mrow"><span class="mlabel">${esc(catLabel(r.category))}</span>
      <span class="mtrack"><span class="mbar" style="width:${r.this_week / max * 100}%"></span>
        <span class="mval">${r.this_week}</span></span>${dir}</div>`;
  }).join("")}</div>
  <p class="note">Bars: complaints opened in the last 7 days. Arrows: change against the 7 days before. More complaints is shown as ▲ in red.</p>`;
}

function learningHtml(l) {
  if (!l || !l.n) return `<p class="muted" style="margin:0">No reviews yet. Every reply a reviewer changes becomes an
    example the next draft for that category learns from.</p>`;
  const words = (list, sign) => (list || []).slice(0, 6).map(([w, n]) =>
    `<span class="pill">${sign} ${esc(w)} <b>${n}</b></span>`).join("") || '<span class="muted">none yet</span>';
  return `<div class="tile-row" style="margin-bottom:10px"><div><div class="kpi">${pct(l.edit_rate)}</div>
      <span class="muted">of ${l.n} reviewed drafts were changed by a person</span></div></div>
    <table class="t"><tr><th>Category</th><th>Reviewed</th><th>Changed</th><th>Rejected</th><th>Examples in new drafts</th></tr>
    ${l.by_category.map(c => `<tr><td>${esc(catLabel(c.category))}</td><td>${c.reviewed}</td>
      <td class="${c.edit_rate >= .3 ? "poor" : ""}">${pct(c.edit_rate)}</td><td>${c.rejected}</td>
      <td>${c.examples_in_drafts}</td></tr>`).join("")}</table>
    <div class="sub">Words reviewers remove</div><div class="row">${words(l.top_removed, "−")}</div>
    <div class="sub">Words reviewers add</div><div class="row">${words(l.top_added, "+")}</div>
    <p class="note">A changed reply is fed back as an example (up to 3 per category) into the next draft's prompt,
      after identifiers are removed. Facts still come only from policy, and every draft is still checked against it.
      A falling "Changed" rate is the sign drafts are getting closer to what your team sends.</p>`;
}

async function loadOverview() {
  health();
  const el = document.getElementById("view-overview");
  let o;
  try { o = await (await fetch("/api/overview")).json(); }
  catch { el.innerHTML = '<p class="muted">Couldn\'t load the overview. Check that the server is running, then press Refresh.</p>'; return; }
  if (!o.total) {
    el.innerHTML = `<div class="band"><div><div class="band-kicker">संवाद · Overview</div>
      <div class="hero">No complaints yet</div>
      <p>Load sample complaints from the Cases tab to see the overview fill in.</p></div></div>`;
    return;
  }
  const s = o.status, r = o.reviews, out = o.outcomes, c = o.cost, t = o.trends, fr = t.first_response;
  const waiting = s.needs_review || 0;
  const within = fr.within_target;
  const meterCls = within == null ? "" : within >= 0.9 ? "ok" : within >= 0.7 ? "warn" : "bad";
  const opened14 = t.opened.reduce((a, b) => a + b, 0), resolved14 = t.resolved.reduce((a, b) => a + b, 0);
  const tile = (label, value, sub, extra = "") => `<div class="card tile"><h3>${label}</h3>
    <div class="tile-row"><div class="kpi">${value}</div>${extra}</div>${sub ? `<p class="note">${sub}</p>` : ""}</div>`;

  el.innerHTML = `
    <section class="band" aria-label="Today">
      <div>
        <div class="band-kicker">संवाद · Overview · ${new Date().toLocaleDateString(undefined, {weekday: "long", day: "numeric", month: "long"})}</div>
        <div class="hero">${waiting}<span>${waiting === 1 ? "complaint is" : "complaints are"} waiting on a person</span></div>
        <p>${t.oldest_waiting_at ? `The oldest has waited ${esc(ago(t.oldest_waiting_at).replace(" ago", ""))}. ` : ""}${s.awaiting_call || 0} more owe a callback.</p>
      </div>
      <div class="band-side">
        ${o.incidents.length ? `<div class="band-alert">● ${o.incidents.length} incident${o.incidents.length > 1 ? "s" : ""} active</div>` : ""}
        <button class="band-cta" onclick="filter='needs_review'; show('cases')">Open the review queue →</button>
      </div>
    </section>

    <div class="grid kpis">
      ${tile("Opened · last 14 days", opened14, `${t.opened[t.opened.length - 1]} today`, sparkline(t.opened, "Opened per day"))}
      ${tile("Resolved · last 14 days", resolved14, out.resolved_rate == null ? "" :
            `${pct(out.resolved_rate)} of closed cases resolved`, sparkline(t.resolved, "Resolved per day"))}
      <div class="card tile"><h3>First reply</h3>
        <div class="tile-row"><div class="kpi">${minutes(fr.median_minutes)}</div><span class="muted">median</span></div>
        ${within == null ? '<p class="note">No replies yet.</p>' : `
        <div class="meter ${meterCls}" role="img" aria-label="${pct(within)} replied within ${minutes(fr.target_minutes)}">
          <span style="width:${within * 100}%"></span></div>
        <p class="note">${pct(within)} within the ${minutes(fr.target_minutes)} target · 9 in 10 within ${minutes(fr.p90_minutes)}</p>`}
      </div>
      ${tile("Posted without a person", r.auto_rate == null ? "—" : pct(r.auto_rate),
            `${r.human} reviewed: ${r.approved_unchanged} approved as drafted, ${r.edited} edited, ${r.rejected} rejected`)}
    </div>

    <div class="viz-grid">
      <div class="card"><h3>Complaints per day</h3>
        <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--s1)"></i>Opened</span>
          <span><i style="background:var(--s2)"></i>Resolved</span></div>
        <div id="vol-chart" class="chart-box"></div>
        <details class="table-view"><summary>Show as table</summary>
          <table class="t"><tr><th>Day</th><th>Opened</th><th>Resolved</th></tr>
          ${t.days.map((d, i) => `<tr><td>${fmtDay(d)}</td><td>${t.opened[i]}</td><td>${t.resolved[i]}</td></tr>`).reverse().join("")}</table>
        </details>
      </div>
      <div class="card"><h3>What people are complaining about</h3>${momentumHtml(t.momentum)}</div>
    </div>

    <div class="card"><h3>What reviewers are teaching it</h3>${learningHtml(o.learning)}</div>

    ${o.incidents.length || o.dead_letters ? `<div class="card"><h3>Needs attention</h3>
      ${o.incidents.map(i => `<div class="clause"><span class="pill ${i.level === 'crisis' ? 'bad' : 'warn'}">${i.level === "crisis" ? "Incident" : "Similar reports"}</span>
        <b>${esc(i.theme)}</b> — ${i.cases} cases here, cluster of ${i.cluster_size}</div>`).join("")}
      ${o.dead_letters ? `<div class="clause"><span class="pill bad">Failed</span> ${o.dead_letters} item(s) gave up after
        retries — <code>python -m sanwaad.delivery</code></div>` : ""}
    </div>` : ""}

    <div class="grid">
      <div class="card"><h3>By severity</h3>${hbars(Object.fromEntries(Object.entries(o.by_severity).map(([k, n]) => [`${k} · ${SEVERITY[k] || ""}`, n])))}</div>
      <div class="card"><h3>By queue tier</h3>${hbars(Object.fromEntries(Object.entries(o.by_tier).map(([k, n]) => [TIER[k] || k, n])))}</div>
      <div class="card"><h3>By author</h3>${hbars(Object.fromEntries(Object.entries(o.by_author).map(([k, n]) => [AUTHOR[k] || k, n])))}</div>
      ${tile("Model cost per closed case", c.avg_per_closed_case_inr == null ? "—" : `₹${num(c.avg_per_closed_case_inr, 4)}`,
            c.total_inr === 0 ? "₹0 because models ran offline (no API key): these are stubs, not real costs"
              : `vs ~₹${c.human_reply_inr} for a person to write the reply · ₹${num(c.total_inr, 4)} spent in all`)}
    </div>

    <div class="card"><h3>What the system has earned the right to do alone</h3>
      ${o.autonomy.length ? `<table class="t"><tr><th>capability</th><th>level</th><th>decisions</th><th>agreement</th><th>why</th></tr>
        ${o.autonomy.map(a => `<tr><td>Replies · ${esc(catLabel(a.capability.replace(/^reply\./, "")))}</td><td title="${esc(a.level)}">${esc(LEVEL[a.level] || a.level)}</td><td>${a.decisions}</td>
          <td>${pct(a.agreement)}</td><td style="text-align:left">${esc(a.reason)}</td></tr>`).join("")}</table>`
        : '<p class="muted" style="margin:0">Nothing yet. Every human review adds to this record.</p>'}
      <p class="note">Approving a draft unchanged counts as agreement; editing or rejecting doesn't.
        Severity above 3 and any money move always stay with a person.</p>
    </div>`;
  const box = document.getElementById("vol-chart");
  box.innerHTML = volumeChart(t, box.clientWidth || 640);
  bindVolumeHover(t);
}

// ---------------------------------------------------------------------------
// Policy — the thresholds, read from the live objects
// ---------------------------------------------------------------------------

// Kept in memory only: a reload forgets the token, which is the point.
const pol = {token: "", actor: "", editing: null, previewed: null, data: null};

async function loadPolicy() {
  health();
  const el = document.getElementById("view-policy");
  let p;
  try { p = await (await fetch("/api/settings")).json(); }
  catch { el.innerHTML = '<p class="muted">Could not reach /api/settings.</p>'; return; }
  pol.data = p;
  const table = obj => `<table class="t">${Object.entries(obj).map(([k, v]) =>
    `<tr><td>${esc(k.replaceAll("_", " "))}</td><td>${esc(typeof v === "number" ? v.toLocaleString() : v)}</td></tr>`).join("")}</table>`;
  const key = e => `${e.policy}.${e.field}`;
  const current = Object.fromEntries(p.editable.map(e => [key(e), e.value]));
  el.innerHTML = `
    <h2>Policy</h2>
    <p class="muted" style="margin:0 0 16px">Every threshold that decides a case's state, as the running server has it.
      Code defaults live in <code>${esc(p.where)}</code>.</p>

    <div class="card"><h3>Change a threshold</h3>
      ${p.editing_enabled ? `
        <div class="row">
          <input id="pol-token" type="password" placeholder="admin token" value="${esc(pol.token)}"
            oninput="pol.token=this.value" style="width:200px">
          <input id="pol-actor" placeholder="your name" value="${esc(pol.actor)}"
            oninput="pol.actor=this.value" style="width:200px">
        </div>
        <p class="note">Each change needs a reason, is checked against hard bounds, and is logged before it takes
          effect. Preview its impact first; Apply appears once you have.</p>`
        : `<p style="margin:0">Editing is <b>off</b>. Set <code>SANWAAD_ADMIN_TOKEN</code> on the server to enable it.
          Values below are still what the server uses.</p>`}
      <table class="t" style="margin-top:10px">
        <tr><th>threshold</th><th>now</th><th>shipped default</th><th>allowed</th><th></th></tr>
        ${p.editable.map(e => `
          <tr><td title="${esc(e.note)}">${esc(e.policy)} · ${esc(e.field.replaceAll("_", " "))}</td>
            <td class="${e.value !== e.default ? 'poor' : ''}">${esc(e.value)}</td>
            <td>${esc(e.default)}</td><td>${e.low}–${e.high}</td>
            <td>${p.editing_enabled ? `<button onclick="editPolicy('${e.policy}','${e.field}')">Change</button>` : ""}</td></tr>
          ${pol.editing === key(e) ? `<tr><td colspan="5" style="text-align:left">${policyForm(e)}</td></tr>` : ""}`).join("")}
      </table>
      <p class="note">Not editable here, by design: the grounding requirement, the ban on auto-promised compensation,
        and the autonomy maximum. The reversal ceiling can only be lowered from its code default, never
        raised. Those change through code review.</p>
    </div>

    ${p.history.length ? `<div class="card"><h3>Change history</h3>
      <table class="t"><tr><th>when</th><th>who</th><th>threshold</th><th>change</th><th>reason</th><th></th></tr>
      ${p.history.map(h => `<tr><td>${esc(new Date(h.at).toLocaleString())}</td><td>${esc(h.actor)}</td>
        <td>${esc(h.policy)}.${esc(h.field)}</td><td>${esc(h.old)} → ${esc(h.new)}${h.reverts ? " (revert)" : ""}</td>
        <td style="text-align:left">${esc(h.reason)}</td>
        <td>${p.editing_enabled && current[`${h.policy}.${h.field}`] === h.new && !h.reverts
          ? `<button onclick="revertPolicy('${esc(h.id)}')">Revert</button>` : ""}</td></tr>`).join("")}
      </table></div>` : ""}

    <div class="grid">
      ${Object.entries(p.policies).map(([name, pol]) => `<div class="card"><h3>${esc(name)}</h3>
        ${table(pol.values)}<p class="note">${esc(pol.doc)}</p></div>`).join("")}
      <div class="card"><h3>Fixed limits</h3>${table(p.fixed)}
        <p class="note">Severity above the autonomy maximum always goes to a person, however good the track record.</p></div>
      <div class="card"><h3>Models</h3>${table(p.models)}</div>
    </div>`;
}

function policyForm(e) {
  const pv = pol.previewed;
  const ready = pv && pv.key === `${e.policy}.${e.field}`;
  return `<div style="padding:8px 0">
    <div class="row">
      <input id="pol-value" value="${esc(ready ? pv.value : e.value)}" style="width:110px"
        oninput="pol.previewed=null; document.getElementById('pol-apply')?.remove()">
      <input id="pol-reason" placeholder="why (required)" style="flex:1; min-width:260px">
      <button onclick="previewPolicy('${e.policy}','${e.field}')">Preview impact</button>
      ${ready ? `<button id="pol-apply" class="primary" onclick="applyPolicy('${e.policy}','${e.field}')">Apply ${esc(pv.value)}</button>` : ""}
      <button onclick="pol.editing=null; pol.previewed=null; loadPolicy()">Cancel</button>
    </div>
    <p class="note">Allowed ${e.low}–${e.high}${e.note ? ` · ${esc(e.note)}` : ""}</p>
    <div id="pol-preview">${ready ? previewHtml(pv.result) : ""}</div>
  </div>`;
}

function previewHtml(r) {
  if (!r.available) return `<p class="note" style="color:var(--warn)">No preview: ${esc(r.why)}.</p>`;
  return `<p style="margin:6px 0">Would decide <b>${r.changed}</b> of ${r.checked} stored cases differently.</p>
    ${r.examples.length ? `<table class="t"><tr><th>case</th><th>category</th><th>severity</th><th>now</th><th>with change</th></tr>
      ${r.examples.map(x => `<tr><td>${esc(x.case_id)}</td><td>${esc(x.category)}</td><td>${esc(x.severity)}</td>
        <td>${esc(x.before)}</td><td>${esc(x.after)}</td></tr>`).join("")}</table>` : ""}
    <p class="note">${esc(r.note)}</p>`;
}

function editPolicy(policy, field) {
  pol.editing = `${policy}.${field}`; pol.previewed = null; loadPolicy();
}

async function postPolicy(url, body, admin) {
  const headers = {"Content-Type": "application/json"};
  if (admin) headers["X-Admin-Token"] = pol.token;
  const r = await fetch(url, {method: "POST", headers, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
  return d;
}

async function previewPolicy(policy, field) {
  const value = document.getElementById("pol-value").value;
  const reason = document.getElementById("pol-reason").value;
  try {
    const result = await postPolicy("/api/settings/preview", {policy, field, value});
    pol.previewed = {key: `${policy}.${field}`, value: result.value ?? value, result};
    await loadPolicy();
    document.getElementById("pol-reason").value = reason;     // survive the re-render
  } catch (e) { status(`preview refused: ${e.message}`); }
}

async function applyPolicy(policy, field) {
  const reason = document.getElementById("pol-reason").value;
  try {
    const d = await postPolicy("/api/settings/change",
      {policy, field, value: pol.previewed.value, reason, actor: pol.actor}, true);
    status(`${policy}.${field}: ${d.old} → ${d.new}`);
    pol.editing = null; pol.previewed = null; loadPolicy();
  } catch (e) { status(`change refused: ${e.message}`); }
}

function revertPolicy(id) {
  // An inline reason field in the header, not a browser prompt(): a revert is
  // a change like any other and needs its reason recorded.
  document.getElementById("pol-revert-box")?.remove();
  const box = document.createElement("div");
  box.className = "toast inline"; box.id = "pol-revert-box";
  box.innerHTML = `<label class="field" for="pol-revert-reason" style="margin:0">Why revert?</label>
    <input id="pol-revert-reason" placeholder="required" style="width:200px">
    <button class="primary" id="pol-revert-go">Revert change</button>
    <button class="ghost" onclick="this.parentElement.remove()">Cancel</button>`;
  document.getElementById("toasts").append(box);
  document.getElementById("pol-revert-go").onclick = async () => {
    try {
      const d = await postPolicy("/api/settings/revert", {change_id: id, actor: pol.actor,
        reason: document.getElementById("pol-revert-reason").value}, true);
      box.remove();
      toast(`Reverted: ${d.policy}.${d.field} is back to ${d.new}.`); loadPolicy();
    } catch (e) { toast(`Revert refused: ${e.message}`, "bad"); }
  };
  document.getElementById("pol-revert-reason").focus();
}

function confusion(b) {
  if (!b) return "";
  const m = b.category.confusion;
  const gold = Object.keys(m);
  const predicted = [...new Set(gold.concat(...gold.map(g => Object.keys(m[g]))))];
  const max = Math.max(1, ...gold.flatMap(g => Object.values(m[g])));
  return `<table class="t cm"><tr><th></th>${predicted.map(p => `<th>${esc(p)}</th>`).join("")}</tr>
    ${gold.map(g => `<tr><td>${esc(g)}</td>${predicted.map(p => {
      const n = m[g][p] || 0;
      const hue = g === p ? "62,207,142" : "240,97,109";
      return `<td style="background:rgba(${hue},${n ? 0.15 + 0.6 * n / max : 0})">${n || ""}</td>`;
    }).join("")}</tr>`).join("")}
  </table>`;
}

load();
</script>
