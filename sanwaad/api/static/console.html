<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanwaad — Review Console</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#9aa4b6;
    --accent:#5b9dff; --warn:#f0b429; --ok:#3ecf8e; --bad:#f0616d; --mono: ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:16px; position:sticky; top:0; background:var(--bg); z-index:5; }
  h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  h1 span { color:var(--dim); font-weight:400; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:7px; padding:7px 13px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04101f; font-weight:600; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  .wrap { display:grid; grid-template-columns:340px 1fr; gap:0; height:calc(100vh - 53px); }
  .list { border-right:1px solid var(--line); overflow-y:auto; }
  .case { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .case:hover { background:var(--panel); }
  .case.sel { background:var(--panel); box-shadow:inset 3px 0 0 var(--accent); }
  .case .who { font-family:var(--mono); font-size:12px; color:var(--dim); }
  .case .txt { margin:5px 0; max-height:3.2em; overflow:hidden; }
  .detail { overflow-y:auto; padding:22px 26px; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px;
          border:1px solid var(--line); color:var(--dim); margin-right:5px; font-family:var(--mono); }
  .pill.s4,.pill.s5 { color:var(--bad); border-color:var(--bad); }
  .pill.s3 { color:var(--warn); border-color:var(--warn); }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase;
             letter-spacing:.08em; color:var(--dim); font-weight:600; }
  textarea { width:100%; min-height:110px; background:var(--bg); color:var(--fg);
             border:1px solid var(--line); border-radius:8px; padding:11px; font:inherit; resize:vertical; }
  .clause { font-family:var(--mono); font-size:12px; padding:6px 0; border-bottom:1px solid var(--line); }
  .clause b { color:var(--accent); }
  .row { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .timeline { font-family:var(--mono); font-size:12px; }
  .timeline div { padding:4px 0; border-bottom:1px solid var(--line); color:var(--dim); }
  .timeline b { color:var(--fg); display:inline-block; min-width:110px; }
  .quote { border-left:2px solid var(--line); padding-left:12px; color:var(--dim); white-space:pre-wrap; }
  .cost { font-family:var(--mono); font-size:20px; color:var(--ok); }
  .muted { color:var(--dim); }
  a { color:var(--accent); }
  .action { padding:10px 0; border-top:1px solid rgba(127,127,127,.22); }
  .action:first-of-type { border-top:0; }
  .checks { font-size:12px; line-height:1.55; opacity:.9; }
  .approve { display:block; margin-top:8px; font-size:13px; }
  /* The health strip. Everything the system degrades around — a tool that is
     failing, a queue that is full, an item that gave up — is invisible in a
     case list, because a case list only shows what worked. */
  #health { margin-left:auto; display:flex; gap:6px; align-items:center; }
  #health .pill { margin:0; cursor:default; }
  #health .pill.bad { color:var(--bad); border-color:var(--bad); }
  #health .pill.warn { color:var(--warn); border-color:var(--warn); }
  /* Views */
  .tabs { display:flex; gap:4px; }
  .tabs button { border-color:transparent; background:none; color:var(--dim); }
  .tabs button.on { color:var(--fg); border-color:var(--line); background:var(--panel); }
  .models { height:calc(100vh - 53px); overflow-y:auto; padding:22px 26px; }
  .models[hidden], .wrap[hidden] { display:none; }
  .models h2 { font-size:15px; margin:0 0 4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-bottom:16px; }
  .score .big { font-family:var(--mono); font-size:26px; margin:2px 0 8px; }
  .score dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; font-size:12px; }
  .score dt { color:var(--dim); }
  .score dd { margin:0; font-family:var(--mono); text-align:right; }
  table.t { width:100%; border-collapse:collapse; font-size:12px; font-family:var(--mono); }
  table.t th { text-align:right; color:var(--dim); font-weight:500; padding:5px 8px; border-bottom:1px solid var(--line); }
  table.t td { text-align:right; padding:5px 8px; border-bottom:1px solid var(--line); }
  table.t th:first-child, table.t td:first-child { text-align:left; }
  table.t td.good { color:var(--ok); }
  table.t td.poor { color:var(--bad); }
  .cm td { min-width:34px; text-align:center !important; }
  .ex { padding:10px 0; border-top:1px solid var(--line); }
  .ex:first-of-type { border-top:0; }
  .ex .txt { margin:4px 0 6px; }
  .pill.wrong { color:var(--bad); border-color:var(--bad); }
  .note { font-size:12px; color:var(--dim); margin:8px 0 0; }
  code { font-family:var(--mono); font-size:12px; background:var(--bg); padding:1px 5px; border-radius:4px; }
  .bar { display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--line); margin:8px 0 4px; }
  .bar span { display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--mono);
              color:#04101f; white-space:nowrap; overflow:hidden; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--dim); font-family:var(--mono); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .rule { display:flex; gap:8px; font-size:12px; padding:3px 0; }
  .rule .mark { width:14px; flex:none; text-align:center; }
  .rule.pass .mark { color:var(--ok); } .rule.fail .mark { color:var(--bad); } .rule.off { color:var(--dim); }
  .scale { position:relative; height:8px; border-radius:4px; margin:14px 0 18px;
           background:linear-gradient(90deg, var(--bad) 0 35%, var(--warn) 35% 55%, var(--ok) 55% 100%); opacity:.85; }
  .scale b { position:absolute; top:-5px; width:3px; height:18px; background:var(--fg); border-radius:2px; }
  .scale em { position:absolute; top:12px; font-size:10px; color:var(--dim); font-style:normal; transform:translateX(-50%); }
  .sub { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 4px; }
  .kpi { font-family:var(--mono); font-size:24px; }
  .kpi small { font-size:12px; color:var(--dim); }
  .hbar { display:grid; grid-template-columns:130px 1fr 40px; gap:8px; align-items:center; font-size:12px; margin:3px 0; }
  .hbar div { height:10px; background:var(--accent); border-radius:3px; min-width:2px; }
  .hbar span:last-child { font-family:var(--mono); text-align:right; color:var(--dim); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>संवाद <span>Sanwaad</span></h1>
  <nav class="tabs">
    <button id="tab-cases" class="on" onclick="show('cases')">Cases</button>
    <button id="tab-overview" onclick="show('overview')">Overview</button>
    <button id="tab-models" onclick="show('models')">Model comparison</button>
    <button id="tab-policy" onclick="show('policy')">Policy</button>
  </nav>
  <button onclick="ingest()">Ingest mock feed</button>
  <button onclick="refreshView()">Refresh</button>
  <span id="status" class="muted"></span>
  <span id="health"></span>
</header>

<div class="wrap" id="view-cases">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><p class="muted">Select a case, or ingest the mock feed to begin.</p></div>
</div>
<div class="models" id="view-overview" hidden></div>
<div class="models" id="view-models" hidden></div>
<div class="models" id="view-policy" hidden></div>

<script>
let cases = [], selected = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = m => document.getElementById("status").textContent = m;

async function ingest() {
  status("ingesting…");
  const r = await fetch("/api/ingest", {method:"POST", headers:{"Content-Type":"application/json"},
                                        body: JSON.stringify({channel:"mock", limit:8})});
  const d = await r.json();
  status(`ingested ${d.ingested}`);
  refreshView();
}

async function health() {
  // /ready answers 503 while the index is warming, so the fetch must not
  // throw the strip away when the answer is the interesting one.
  let r;
  try { r = await (await fetch("/ready")).json(); } catch { return; }
  const dl = await (await fetch("/api/delivery")).json().catch(() => ({dead: []}));
  const pills = [];
  pills.push(r.ready
    ? `<span class="pill ok">index ${r.clauses}</span>`
    : `<span class="pill bad">index ${esc(r.index)}</span>`);
  pills.push(`<span class="pill">models ${esc(r.models)}</span>`);
  if (r.triage) {
    pills.push(`<span class="pill ${r.triage.available ? '' : 'warn'}" title="${esc(r.triage.detail)}"
      >triage ${esc(r.triage.live)}</span>`);
  }
  for (const p of r.concurrency || []) {
    const full = p.running >= p.limit;
    pills.push(`<span class="pill ${full ? 'warn' : ''}" title="peak ${p.peak_running}, refused ${p.refused}"
      >${esc(p.pool)} ${p.running}/${p.limit}</span>`);
  }
  for (const c of r.circuits || []) {
    pills.push(`<span class="pill bad" title="${c.trips} trips">${esc(c.tool)} ${esc(c.state)}</span>`);
  }
  if ((dl.dead || []).length) {
    pills.push(`<span class="pill bad" title="python -m sanwaad.delivery"
      >${dl.dead.length} dead-lettered</span>`);
  }
  document.getElementById("health").innerHTML = pills.join("");
}

async function load() {
  health();
  const d = await (await fetch("/api/cases")).json();
  cases = d.cases;
  document.getElementById("list").innerHTML = cases.map(c => {
    const t = c.triage || {};
    const v = c.verdict || {}, p = c.pattern || {}, pr = c.priority || {};
    const done = c.closure ? "ok" : "";
    return `<div class="case ${selected===c.case_id?'sel':''}" onclick="open_('${c.case_id}')">
      <div class="who">${esc(c.complaint?.author)} · ${esc(c.complaint?.channel)}
        ${c.complaint && c.complaint.tagged === false ? '<span class="pill">untagged</span>' : ''}</div>
      <div class="txt">${esc(c.complaint?.text)}</div>
      ${p.level === "crisis" ? `<span class="pill s5">crisis · ${p.cluster_size}</span>` :
        (p.level === "watch" ? `<span class="pill s3">watch · ${p.cluster_size}</span>` : '')}
      <span class="pill s${t.severity||1}">sev ${t.severity ?? "?"}</span>
      <span class="pill">${esc(t.category||"…")}</span>
      ${v.author_class && v.author_class !== "customer" ?
        `<span class="pill">${esc(v.author_class)}</span>` : ''}
      ${pr.tier === "ignore" ? '<span class="pill">logged only</span>' : ''}
      ${c.closure ? '<span class="pill ok">closed</span>' :
        (c.review ? '<span class="pill">in flight</span>' : '<span class="pill s3">needs review</span>')}
    </div>`;
  }).join("") || '<p class="muted" style="padding:16px">No cases yet.</p>';
}

async function open_(id) {
  selected = id; load();
  const c = await (await fetch(`/api/cases/${id}`)).json();
  const s = c.state, t = s.triage||{}, d = s.draft||{}, g = s.grounding||{};
  const v = s.verdict||{}, pat = s.pattern||{}, pri = s.priority||{};
  const pending = c.pending || null;
  const awaitingVoice = pending && pending.await === "voice_call";
  const awaitingReview = pending && !awaitingVoice;
  const cl = s.closure;

  document.getElementById("detail").innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <span class="pill s${t.severity||1}">severity ${t.severity}</span>
      <span class="pill">${esc(t.category)}</span>
      <span class="pill">${esc(t.sentiment)}</span>
      <span class="pill">reply in ${esc(t.language)}</span>
      ${g.grounded ? '<span class="pill ok">grounded</span>' : '<span class="pill s4">ungrounded</span>'}
    </div>

    <div class="card"><h3>Who is speaking, and how many of them</h3>
      <div class="row" style="margin-bottom:10px">
        <span class="pill">${esc(v.author_class||"?")}</span>
        <span class="pill">authenticity ${v.authenticity ?? "?"}</span>
        <span class="pill">reach ${(v.reach ?? 0).toLocaleString()}</span>
        ${v.history_with_brand ? `<span class="pill">${v.history_with_brand} prior case(s)</span>` : ''}
        ${v.reply_worthy === false ? '<span class="pill s4">not answered</span>' : ''}
        ${pat.level && pat.level !== "none" ?
          `<span class="pill ${pat.level==='crisis'?'s5':'s3'}">${esc(pat.level)} ·
            ${pat.cluster_size} people · ${pat.velocity_per_hour}/hr</span>` : ''}
        ${pri.tier ? `<span class="pill">${esc(pri.tier)}</span>` : ''}
      </div>
      ${(v.evidence||[]).length ?
        `<p class="muted" style="margin:0;font-size:12px">${esc((v.evidence||[]).join(" · "))}</p>` : ''}
      ${pat.theme ? `<p class="muted" style="margin:6px 0 0;font-size:12px">theme — ${esc(pat.theme)}</p>` : ''}
    </div>

    ${whyCard(c.explain)}

    <div class="card"><h3>Customer said</h3>
      <div class="quote">${esc(s.complaint?.text)}</div>
      <p class="muted" style="margin:10px 0 0;font-size:12px">${esc(t.summary)}</p>
    </div>

    ${awaitingReview ? `
    <div class="card"><h3>Draft reply — needs you</h3>
      <p class="muted" style="margin:-4px 0 10px;font-size:12px">Held because: ${esc(pending.reason)}</p>
      <textarea id="draft">${esc(d.text)}</textarea>
      ${(g.unsupported_claims||[]).length ? `<p style="color:var(--bad);font-size:12px">
         Unsupported: ${g.unsupported_claims.map(esc).join(" · ")}</p>` : ""}
      <div class="row" style="margin-top:11px">
        <button class="primary" onclick="review('${id}','approve')">Approve &amp; post</button>
        <button onclick="review('${id}','edit')">Post my edit</button>
        <button class="danger" onclick="review('${id}','reject')">Reject</button>
      </div>
    </div>` : `
    <div class="card"><h3>Public reply</h3>
      <div class="quote">${esc((s.review||{}).final_text || d.text)}</div>
      ${s.review ? `<p class="muted" style="font-size:12px;margin:9px 0 0">
        ${s.review.auto ? "auto-approved" : "reviewed by " + esc(s.review.reviewer)} — ${esc(s.review.note)}</p>`:""}
    </div>`}

    ${(s.actions||[]).length ? `
    <div class="card"><h3>Proposed actions${awaitingReview ? " — approve each one separately" : ""}</h3>
      ${(s.actions||[]).map(a => {
        const p = a.proposal, v = a.validation;
        const res = (s.action_results||[]).find(r => r.action_id === p.id);
        const canApprove = awaitingReview && p.risk === "write_high" && v.ok;
        return `<div class="action">
          <div class="row">
            <span class="pill ${v.ok ? 'ok' : 's5'}">${v.ok ? 'valid' : 'blocked'}</span>
            <span class="pill">${esc(p.kind)}</span>
            <span class="pill">${esc(p.risk.replace('_', ' '))}</span>
            ${p.reference ? `<b>${esc(p.reference)}</b>` : ''}
            ${p.amount_inr ? `₹${Number(p.amount_inr).toLocaleString('en-IN')}` : ''}
            ${res ? `<span class="pill ${res.status === 'executed' ? 'ok' : 's3'}">${esc(res.status)}</span>` : ''}
          </div>
          <p class="muted" style="margin:6px 0;font-size:12px">${esc(p.reason)} · proposed by ${esc(p.proposed_by)}</p>
          <div class="checks">${v.checks.map(c =>
            `<div>${c.passed ? '✓' : '✗'} <b>${esc(c.name)}</b> ${esc(c.detail)}</div>`).join("")}</div>
          ${canApprove ? `<label class="approve"><input type="checkbox" class="act-approve"
             data-id="${esc(p.id)}"> Approve this exact ${esc(p.kind)}</label>` : ''}
          ${res && res.detail ? `<p class="muted" style="font-size:12px;margin:6px 0 0">${esc(res.detail)}</p>` : ''}
        </div>`;
      }).join("")}
    </div>` : ""}

    ${awaitingVoice ? `
    <div class="card"><h3>Voice escalation pending</h3>
      <p style="margin:0 0 10px">${(s.escalation?.reasons||[]).map(esc).join("<br>")}</p>
      <a href="/call/${id}" target="_blank"><button class="primary">Open browser call</button></a>
      <button onclick="skipVoice('${id}')">Mark call skipped</button>
    </div>` : ""}

    <div class="card"><h3>Policy clauses behind this reply</h3>
      ${(s.citations||[]).slice(0,8).map(c =>
        `<div class="clause"><b>${esc(c.clause_id)}</b> ${esc(c.heading)}</div>`).join("")}
    </div>

    ${cl ? `
    <div class="card"><h3>Closure</h3>
      <div class="cost">₹${cl.total_cost_inr.toFixed(4)}</div>
      <p class="muted" style="margin:2px 0 12px;font-size:12px">
        cost to resolve · ${cl.llm_calls} LLM calls · vs ~₹18–85 for a human</p>
      <h3>Consistency receipt</h3>
      <p style="margin:0">${cl.consistency.consistent
        ? '<span class="pill ok">channels agree</span>'
        : '<span class="pill s5">CHANNELS DIVERGED</span>'}</p>
      <div class="clause" style="margin-top:8px">shared: <b>${cl.consistency.shared_clauses.join(", ")||"—"}</b></div>
      <div class="clause">text only: ${cl.consistency.text_only.join(", ")||"—"}</div>
      <div class="clause">voice only: ${cl.consistency.voice_only.join(", ")||"—"}</div>
    </div>` : ""}

    <div class="card"><h3>Timeline</h3>
      <div class="timeline">${(s.events||[]).map(e =>
        `<div><b>${esc(e.stage)}</b> ${esc(e.message)}</div>`).join("")}</div>
    </div>`;
}

async function review(id, decision) {
  const ta = document.getElementById("draft");
  status("submitting…");
  await fetch(`/api/cases/${id}/review`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({decision, final_text: ta ? ta.value : null, reviewer:"you",
      actions: Object.fromEntries([...document.querySelectorAll(".act-approve")]
        .map(cb => [cb.dataset.id, cb.checked ? "approve" : "reject"]))})});
  status("done"); open_(id); load();
}

async function skipVoice(id) {
  await fetch(`/api/cases/${id}/voice-outcome`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({happened:false, channel:"none", resolved:false, summary:"call skipped"})});
  open_(id); load();
}

// ---------------------------------------------------------------------------
// Model comparison — reads what `python -m sanwaad.evals.triage_compare` wrote
// ---------------------------------------------------------------------------

let view = "cases", comparison = null, cmBackend = null;

const VIEWS = ["cases", "overview", "models", "policy"];

function show(v) {
  view = v;
  for (const name of VIEWS) {
    document.getElementById(`view-${name}`).hidden = name !== v;
    document.getElementById(`tab-${name}`).classList.toggle("on", name === v);
  }
  refreshView();
}

function refreshView() {
  ({cases: load, overview: loadOverview, models: loadModels, policy: loadPolicy})[view]();
}

const pct = v => v == null ? "—" : `${(v * 100).toFixed(1)}%`;
const num = (v, d = 0) => v == null ? "—" : Number(v).toFixed(d);

async function loadModels() {
  health();
  const el = document.getElementById("view-models");
  let d;
  try { d = await (await fetch("/api/evals/triage")).json(); }
  catch { el.innerHTML = '<p class="muted">Could not reach /api/evals/triage.</p>'; return; }
  comparison = d;
  renderModels();
}

function statusCard(st) {
  return `<div class="card"><h3>Triage backends on this server</h3>
    <div class="row">${Object.entries(st.backends).map(([name, b]) =>
      `<span class="pill ${b.available ? 'ok' : ''}" title="${esc(b.detail)}">${esc(name)}${
        name === st.live ? ' · live' : ''}</span>`).join("")}</div>
    <p class="note">${Object.entries(st.backends).map(([n, b]) =>
      `<b>${esc(n)}</b>: ${esc(b.detail)}`).join("<br>")}</p>
    <p class="note">Live triage uses <code>SANWAAD_TRIAGE_BACKEND=${esc(st.live)}</code>. A decision
      model whose category confidence is below <code>SANWAAD_TRIAGE_MIN_CONFIDENCE=${esc(st.min_confidence)}</code>
      hands that comment to Gemini, and the case timeline says so.</p>
  </div>`;
}

function renderModels() {
  const el = document.getElementById("view-models");
  const d = comparison, r = d.result;
  if (!r) {
    el.innerHTML = `<h2>Model comparison</h2>
      <p class="muted" style="margin:0 0 16px">No comparison has been run yet.</p>
      <div class="card"><h3>Run one on your own complaints</h3>
        <p style="margin:0 0 8px">A CSV with a <code>text</code> column and a <code>category</code> column
          (<code>id</code> and <code>channel</code> optional). Start from
          <code>sanwaad/evals/data/triage_template.csv</code>.</p>
        <p style="margin:0"><code>python -m sanwaad.evals.triage_compare --data your_complaints.csv</code></p>
        <p class="note">Then press Refresh. Example texts are redacted before they are saved.</p>
      </div>
      ${d.error ? `<p style="color:var(--bad)">${esc(d.error)}</p>` : ""}
      ${statusCard(d.status)}`;
    return;
  }

  const bs = r.backends;
  const best = (f, lower) => {
    const vals = bs.map(f).filter(v => v != null);
    if (!vals.length) return null;
    return lower ? Math.min(...vals) : Math.max(...vals);
  };
  const topAcc = best(b => b.category.accuracy), topF1 = best(b => b.category.macro_f1);
  const fastest = best(b => b.latency_ms.p50, true), cheapest = best(b => b.cost_inr.per_1k, true);
  if (!cmBackend || !bs.find(b => b.backend === cmBackend)) cmBackend = bs[0]?.backend;

  const classes = Object.keys(r.dataset.class_counts);
  const when = new Date(r.generated_at).toLocaleString();

  el.innerHTML = `
    <h2>Model comparison — triage category</h2>
    <p class="muted" style="margin:0 0 16px">${esc(r.dataset.name)} · ${r.dataset.rows} comments,
      ${r.dataset.labelled} labelled · run ${esc(when)}</p>

    ${bs.length ? `<div class="grid">${bs.map(b => {
      const tags = [];
      if (b.category.accuracy != null && b.category.accuracy === topAcc) tags.push("most accurate");
      if (b.category.macro_f1 != null && b.category.macro_f1 === topF1 && bs.length > 1) tags.push("best macro-F1");
      if (b.latency_ms.p50 === fastest && bs.length > 1) tags.push("fastest");
      if (b.cost_inr.per_1k === cheapest && bs.length > 1) tags.push("cheapest");
      const offline = Object.keys(b.models).some(m => m === "offline" || m === "degraded");
      return `<div class="card score"><h3>${esc(b.backend)}</h3>
        <div class="big">${pct(b.category.accuracy)}</div>
        <div class="row" style="margin-bottom:10px">${tags.map(t => `<span class="pill ok">${t}</span>`).join("")}
          ${offline ? '<span class="pill s3" title="No API key: these are the keyword stub\'s answers">offline stub</span>' : ''}</div>
        <dl>
          <dt>macro-F1</dt><dd>${num(b.category.macro_f1, 3)}</dd>
          <dt>calibration error</dt><dd>${b.calibration.reports_confidence ? num(b.calibration.ece, 3) : "no confidence"}</dd>
          <dt>latency p50 / p95</dt><dd>${num(b.latency_ms.p50)} / ${num(b.latency_ms.p95)} ms</dd>
          <dt>cost per 1,000</dt><dd>₹${num(b.cost_inr.per_1k, 2)}</dd>
          <dt>scored</dt><dd>${b.category.n} of ${b.rows_run}</dd>
          ${b.error_count ? `<dt style="color:var(--bad)">failed rows</dt><dd style="color:var(--bad)">${b.error_count}</dd>` : ""}
        </dl>
        <p class="note">${Object.entries(b.models).map(([m, n]) => `${esc(m)} × ${n}`).join(" · ")}</p>
      </div>`;
    }).join("")}</div>` : '<p class="muted">No backend could run.</p>'}

    ${r.skipped.length ? `<div class="card"><h3>Not run</h3>${r.skipped.map(s =>
      `<div class="clause"><b>${esc(s.backend)}</b> ${esc(s.reason)}</div>`).join("")}</div>` : ""}

    ${bs.length && classes.length ? `<div class="card"><h3>Recall by category — how many of each it caught</h3>
      <table class="t"><tr><th>category</th><th>support</th>${bs.map(b =>
        `<th>${esc(b.backend)} recall</th><th>precision</th>`).join("")}</tr>
      ${classes.map(c => `<tr><td>${esc(c)}</td><td>${r.dataset.class_counts[c]}</td>${bs.map(b => {
        const pc = b.category.per_class[c] || {};
        const cls = pc.recall == null ? "" : pc.recall >= 0.8 ? "good" : pc.recall < 0.5 ? "poor" : "";
        return `<td class="${cls}">${pct(pc.recall)}</td><td>${pct(pc.precision)}</td>`;
      }).join("")}</tr>`).join("")}
      </table>
      <p class="note">A model can score well overall by never predicting a rare category. Low recall on
        <code>data_privacy</code> or <code>account_access</code> matters most: those always escalate.</p>
    </div>` : ""}

    ${bs.some(b => b.calibration.reports_confidence) ? `<div class="card">
      <h3>If we only trust confident answers</h3>
      <table class="t"><tr><th>backend</th><th>min confidence</th><th>handles</th><th>accuracy on those</th></tr>
      ${bs.filter(b => b.calibration.reports_confidence).map(b => b.calibration.selective.map((s, i) =>
        `<tr><td>${i ? "" : esc(b.backend)}</td><td>${s.threshold.toFixed(2)}</td>
          <td>${pct(s.coverage)}</td><td>${pct(s.accuracy)}</td></tr>`).join("")).join("")}
      </table>
      <p class="note">"Handles" is the share of comments the decision model triages on its own; the rest
        go to Gemini. Pick the lowest threshold whose accuracy you accept and set it as
        <code>SANWAAD_TRIAGE_MIN_CONFIDENCE</code>.</p>
    </div>` : ""}

    ${bs.length && classes.length ? `<div class="card">
      <h3>What gets mixed up —
        <select onchange="cmBackend=this.value; renderModels()">${bs.map(b =>
          `<option ${b.backend === cmBackend ? "selected" : ""}>${esc(b.backend)}</option>`).join("")}</select></h3>
      ${confusion(bs.find(b => b.backend === cmBackend))}
      <p class="note">Rows are the correct label, columns what the model said. Off-diagonal cells are mistakes.</p>
    </div>` : ""}

    ${r.agreement.length ? `<div class="card"><h3>Agreement on fields nobody labelled</h3>
      <table class="t"><tr><th>pair</th><th>n</th><th>severity</th><th>severity ±1</th>
        <th>sentiment</th><th>is complaint</th><th>needs private data</th></tr>
      ${r.agreement.map(a => `<tr><td>${esc(a.a)} vs ${esc(a.b)}</td><td>${a.n}</td>
        <td>${pct(a.severity)}</td><td>${pct(a.severity_within_1)}</td><td>${pct(a.sentiment)}</td>
        <td>${pct(a.is_complaint)}</td><td>${pct(a.needs_private_data)}</td></tr>`).join("")}
      </table>
      <p class="note">Agreement, not accuracy: two models can agree and both be wrong. Label severity in the
        CSV to score it properly.</p>
    </div>` : ""}

    ${r.examples.length ? `<div class="card"><h3>Where they went wrong or disagreed (${r.examples.length})</h3>
      ${r.examples.map(x => `<div class="ex">
        <div class="who">${esc(x.id)}${x.gold ? ` · correct: <b>${esc(x.gold)}</b>` : " · unlabelled"}</div>
        <div class="txt">${esc(x.text)}</div>
        <div class="row">${Object.entries(x.predictions).map(([n, p]) => {
          const wrong = x.gold && p.category !== x.gold;
          return `<span class="pill ${wrong ? 'wrong' : x.gold ? 'ok' : ''}">${esc(n)}: ${esc(p.category)}${
            p.confidence != null ? ` ${(p.confidence * 100).toFixed(0)}%` : ""} · sev ${p.severity}</span>`;
        }).join("")}</div>
      </div>`).join("")}
    </div>` : ""}

    ${statusCard(d.status)}`;
}

// ---------------------------------------------------------------------------
// Why a case is where it is — every line comes from the code that decided it
// ---------------------------------------------------------------------------

const PART_COLOURS = {severity:"#f0616d", authenticity:"#3ecf8e", reach:"#5b9dff",
                      pattern:"#f0b429", history:"#b39dff"};

function ruleRow(ok, text, detail, off) {
  const cls = off ? "off" : ok ? "pass" : "fail";
  return `<div class="rule ${cls}"><span class="mark">${off ? "·" : ok ? "✓" : "✗"}</span>
    <span><b>${esc(text)}</b>${detail ? ` <span class="muted">— ${esc(detail)}</span>` : ""}</span></div>`;
}

function whyCard(x) {
  if (!x) return "";
  const p = x.priority, a = x.author, rv = x.review, esc_ = x.escalation;
  const parts = Object.entries(p.components || {}).filter(([, v]) => v > 0);
  const total = parts.reduce((s, [, v]) => s + v, 0) || 1;
  const pos = v => `${Math.max(0, Math.min(1, v ?? 0)) * 100}%`;

  let review = "";
  if (rv) {
    const then = rv.at_the_time;
    const drift = then && then.allowed !== rv.allowed_now;
    // Every hard rule is evaluated, so a second failure is real and shown; the
    // first one is the reason the gate gave.
    const first = rv.checks.findIndex(c => !c.passed);
    review = `<div class="sub">Review gate — could it post without a person?</div>
      ${rv.checks.map((c, i) => ruleRow(c.passed, c.rule + (i === first ? " (reason given)" : ""),
        c.passed ? (c.kind === "hard" ? "" : c.detail) : c.detail)).join("")}
      <p class="note">${then ? `At the time: <b>${then.allowed ? "posted on its own" : "held for a person"}</b>
        (${esc(then.reason || "")}).` : ""}
        ${drift ? ` <span style="color:var(--warn)">Evaluated now it would ${rv.allowed_now ? "post" : "be held"}:
        earned autonomy has changed since.</span>` : ""}</p>`;
  }

  return `<div class="card"><h3>Why this case is where it is</h3>
    <div class="sub">Queue priority — ${esc(p.tier || "?")}, score ${p.score ?? "?"}</div>
    <div class="bar">${parts.map(([k, v]) =>
      `<span style="width:${v / total * 100}%;background:${PART_COLOURS[k] || "#888"}"
        title="${esc(k)} ${v}">${v / total > 0.12 ? `${esc(k)} ${v}` : ""}</span>`).join("")}</div>
    <div class="legend">${parts.map(([k, v]) =>
      `<span><i style="background:${PART_COLOURS[k] || "#888"}"></i>${esc(k)} ${v}</span>`).join("")}</div>
    <p class="note">${esc(p.formula)}${p.recomputed ? " · itemised from the stored inputs" : ""}</p>
    ${(p.reasons || []).length ? `<p class="note">Tier because: ${p.reasons.map(esc).join(" · ")}</p>` : ""}

    <div class="sub">Author — ${esc(a.class || "?")}, authenticity ${a.authenticity ?? "?"}</div>
    <div class="scale"><b style="left:${pos(a.authenticity)}"></b>
      <em style="left:${pos(a.bands.troll_at_or_below)}">troll ≤ ${a.bands.troll_at_or_below}</em>
      <em style="left:${pos(a.bands.audience_at_or_above)}">audience ≥ ${a.bands.audience_at_or_above}</em></div>
    <p class="note">${(a.evidence || []).length ? a.evidence.map(esc).join(" · ") : "no author evidence recorded"}.
      Answered if authenticity ≥ ${a.bands.answer_if_authenticity_at_least} or reach ≥
      ${Number(a.bands.or_reach_at_least).toLocaleString()} (reach here ${Number(a.reach ?? 0).toLocaleString()}).</p>

    ${review}

    ${esc_ ? `<div class="sub">Voice callback triggers (clause ESC-02)</div>
      ${esc_.checks.map(c => ruleRow(c.fired, c.rule, c.fired ? c.detail : "", !c.fired)).join("")}
      <p class="note">${esc_.checks.some(c => c.fired) ? "Any one trigger offers a call." : "No trigger fired, so no call is offered."}</p>` : ""}
  </div>`;
}

// ---------------------------------------------------------------------------
// Overview
// ---------------------------------------------------------------------------

function hbars(obj) {
  const entries = Object.entries(obj || {});
  const max = Math.max(1, ...entries.map(([, n]) => n));
  return entries.map(([k, n]) => `<div class="hbar"><span>${esc(k)}</span>
    <div style="width:${n / max * 100}%"></div><span>${n}</span></div>`).join("") || '<p class="muted">—</p>';
}

async function loadOverview() {
  health();
  const el = document.getElementById("view-overview");
  let o;
  try { o = await (await fetch("/api/overview")).json(); }
  catch { el.innerHTML = '<p class="muted">Could not reach /api/overview.</p>'; return; }
  if (!o.total) {
    el.innerHTML = '<h2>Overview</h2><p class="muted">No cases yet. Ingest the mock feed to begin.</p>';
    return;
  }
  const s = o.status, r = o.reviews, out = o.outcomes, c = o.cost;
  const kpi = (label, value, sub) => `<div class="card"><h3>${label}</h3>
    <div class="kpi">${value}</div>${sub ? `<p class="note">${sub}</p>` : ""}</div>`;
  el.innerHTML = `
    <h2>Overview</h2>
    <p class="muted" style="margin:0 0 16px">${o.total} cases · ${o.untagged} found without a tag</p>
    <div class="grid">
      ${kpi("Waiting on a person", s.needs_review || 0, `${s.awaiting_call || 0} more owed a callback`)}
      ${kpi("Resolved", `${out.resolved} <small>of ${out.closed} closed</small>`,
            out.resolved_rate == null ? "" : `${pct(out.resolved_rate)} resolved · ${out.degraded} with a degraded step`)}
      ${kpi("Posted without a person", r.auto_rate == null ? "—" : pct(r.auto_rate),
            `${r.auto} auto · ${r.human} human (${r.approved_unchanged} approved as drafted, ${r.edited} edited, ${r.rejected} rejected)`)}
      ${kpi("Model cost per closed case", c.avg_per_closed_case_inr == null ? "—" : `₹${num(c.avg_per_closed_case_inr, 4)}`,
            `vs ~₹${c.human_reply_inr} for a person to write the reply · ₹${num(c.total_inr, 4)} spent in all`)}
    </div>

    ${o.incidents.length || o.dead_letters ? `<div class="card"><h3>Needs attention</h3>
      ${o.incidents.map(i => `<div class="clause"><span class="pill ${i.level === 'crisis' ? 's5' : 's3'}">${esc(i.level)}</span>
        <b>${esc(i.theme)}</b> — ${i.cases} cases here, cluster of ${i.cluster_size}</div>`).join("")}
      ${o.dead_letters ? `<div class="clause"><span class="pill s5">dead-lettered</span> ${o.dead_letters} item(s) gave up after
        retries — <code>python -m sanwaad.delivery</code></div>` : ""}
    </div>` : ""}

    <div class="grid">
      <div class="card"><h3>By category</h3>${hbars(o.by_category)}</div>
      <div class="card"><h3>By severity</h3>${hbars(o.by_severity)}</div>
      <div class="card"><h3>By queue tier</h3>${hbars(o.by_tier)}</div>
      <div class="card"><h3>By author</h3>${hbars(o.by_author)}</div>
    </div>

    <div class="card"><h3>What the system has earned the right to do alone</h3>
      ${o.autonomy.length ? `<table class="t"><tr><th>capability</th><th>level</th><th>decisions</th><th>agreement</th><th>why</th></tr>
        ${o.autonomy.map(a => `<tr><td>${esc(a.capability)}</td><td>${esc(a.level)}</td><td>${a.decisions}</td>
          <td>${pct(a.agreement)}</td><td style="text-align:left">${esc(a.reason)}</td></tr>`).join("")}</table>`
        : '<p class="muted" style="margin:0">Nothing yet. Every human review adds to this record.</p>'}
      <p class="note">Approving a draft unchanged counts as agreement; editing or rejecting doesn't.
        Severity above 3 and any money move always stay with a person.</p>
    </div>`;
}

// ---------------------------------------------------------------------------
// Policy — the thresholds, read from the live objects
// ---------------------------------------------------------------------------

async function loadPolicy() {
  health();
  const el = document.getElementById("view-policy");
  let p;
  try { p = await (await fetch("/api/settings")).json(); }
  catch { el.innerHTML = '<p class="muted">Could not reach /api/settings.</p>'; return; }
  const table = obj => `<table class="t">${Object.entries(obj).map(([k, v]) =>
    `<tr><td>${esc(k.replaceAll("_", " "))}</td><td>${esc(typeof v === "number" ? v.toLocaleString() : v)}</td></tr>`).join("")}</table>`;
  el.innerHTML = `
    <h2>Policy</h2>
    <p class="muted" style="margin:0 0 16px">Every threshold that decides a case's state, as the running server has it.
      Read-only: these change through <code>${esc(p.where)}</code> and a restart.</p>
    <div class="grid">
      ${Object.entries(p.policies).map(([name, pol]) => `<div class="card"><h3>${esc(name)}</h3>
        ${table(pol.values)}<p class="note">${esc(pol.doc)}</p></div>`).join("")}
      <div class="card"><h3>Fixed limits</h3>${table(p.fixed)}
        <p class="note">Severity above the autonomy maximum always goes to a person, however good the track record.</p></div>
      <div class="card"><h3>Models</h3>${table(p.models)}</div>
    </div>`;
}

function confusion(b) {
  if (!b) return "";
  const m = b.category.confusion;
  const gold = Object.keys(m);
  const predicted = [...new Set(gold.concat(...gold.map(g => Object.keys(m[g]))))];
  const max = Math.max(1, ...gold.flatMap(g => Object.values(m[g])));
  return `<table class="t cm"><tr><th></th>${predicted.map(p => `<th>${esc(p)}</th>`).join("")}</tr>
    ${gold.map(g => `<tr><td>${esc(g)}</td>${predicted.map(p => {
      const n = m[g][p] || 0;
      const hue = g === p ? "62,207,142" : "240,97,109";
      return `<td style="background:rgba(${hue},${n ? 0.15 + 0.6 * n / max : 0})">${n || ""}</td>`;
    }).join("")}</tr>`).join("")}
  </table>`;
}

load();
</script>
</body>
</html>
