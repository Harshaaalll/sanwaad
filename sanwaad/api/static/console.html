<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanwaad — Review Console</title>
<style>
  /* Layout: a work queue on the left, the case being decided on the right;
     on narrow screens the two stack and a Back button returns to the queue.
     Tokens first: light by default, dark from the OS or the header toggle. */
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eef1f5; --line:#dde2ea; --fg:#18202c; --dim:#5a6475;
    --accent:#2e5bcc; --on-accent:#ffffff; --accent-soft:#e6edfb;
    --ok:#17704b; --control:#7a8497; --ok-soft:#e3f4ec; --warn:#9a6300; --warn-soft:#fcf1dc; --bad:#c0392f; --bad-soft:#fbe8e6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
    --radius: 10px;
    --s1:#2a78d6; --s2:#eb6834; --grid:#e6e9ef; --axis:#b7bfcc; --muted-mark:#b4bccb;
    --brand:#25237a; --brand-ink:#ffffff; --brand-dim:#c9c8f0; --marigold:#f2a93b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0f1218; --panel:#171b23; --panel-2:#1e2430; --line:#2a313e; --fg:#e7eaf0; --dim:#9aa4b6;
    --accent:#6f9cff; --on-accent:#08132b; --accent-soft:#1c2a4a;
    --ok:#46cf92; --control:#687388; --ok-soft:#133528; --warn:#f0b43c; --warn-soft:#3a2d12; --bad:#f07068; --bad-soft:#3d1c1a;
    --s1:#3987e5; --s2:#d95926; --grid:#262d39; --axis:#3a4352; --muted-mark:#4b5566;
    --brand:#1f1d5c; --brand-ink:#ffffff; --brand-dim:#b7b5ea; --marigold:#f2a93b;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg:#0f1218; --panel:#171b23; --panel-2:#1e2430; --line:#2a313e; --fg:#e7eaf0; --dim:#9aa4b6;
    --accent:#6f9cff; --on-accent:#08132b; --accent-soft:#1c2a4a;
    --ok:#46cf92; --control:#687388; --ok-soft:#133528; --warn:#f0b43c; --warn-soft:#3a2d12; --bad:#f07068; --bad-soft:#3d1c1a;
    --s1:#3987e5; --s2:#d95926; --grid:#262d39; --axis:#3a4352; --muted-mark:#4b5566;
    --brand:#1f1d5c; --brand-ink:#ffffff; --brand-dim:#b7b5ea; --marigold:#f2a93b;
    color-scheme: dark; }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 var(--sans); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--control); border-radius:8px;
           padding:7px 13px; cursor:pointer; font:inherit; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; border-color:var(--line); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button.danger.armed { background:var(--bad); color:var(--panel); }
  button.ghost { background:none; border-color:transparent; color:var(--dim); }
  button.ghost:hover { color:var(--fg); border-color:var(--line); }
  a { color:var(--accent); }
  code { font-family:var(--mono); font-size:12px; background:var(--panel-2); padding:1px 5px; border-radius:4px; }
  .muted { color:var(--dim); }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* Header */
  header { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--line);
           background:var(--panel); position:sticky; top:0; z-index:10; }
  h1 { font-size:15px; margin:0; white-space:nowrap; letter-spacing:.01em; }
  h1 span { color:var(--dim); font-weight:500; }
  .tabs { display:flex; gap:2px; overflow-x:auto; min-width:0; scrollbar-width:none; }
  .tabs button { border-color:transparent; background:none; color:var(--dim); white-space:nowrap; }
  .tabs button.on { color:var(--fg); background:var(--panel-2); font-weight:600; }
  .spacer { flex:1; }
  .sys { position:relative; flex:none; }
  .sys-btn { display:flex; align-items:center; gap:7px; border-radius:99px; padding:5px 12px; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }
  .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
  .sys-pop { position:absolute; right:0; top:calc(100% + 6px); width:300px; background:var(--panel);
             border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;
             box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:20; font-size:13px; }
  .sys-pop dl { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0; }
  .sys-pop dt { color:var(--dim); } .sys-pop dd { margin:0; text-align:right; }

  /* Pills: state encoded in colour and words, never colour alone */
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 9px; border-radius:99px;
          border:1px solid var(--line); color:var(--dim); background:var(--panel); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:transparent; background:var(--ok-soft); }
  .pill.warn, .pill.s3 { color:var(--warn); border-color:transparent; background:var(--warn-soft); }
  .pill.bad, .pill.s4, .pill.s5, .pill.wrong { color:var(--bad); border-color:transparent; background:var(--bad-soft); }
  .pill.info { color:var(--accent); border-color:transparent; background:var(--accent-soft); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* Cases view */
  .wrap { display:grid; grid-template-columns:minmax(300px, 380px) 1fr; height:calc(100vh - 57px); }
  .queue { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--panel); }
  .qtools { padding:12px 12px 8px; display:grid; gap:8px; border-bottom:1px solid var(--line); }
  .qtools .row { gap:6px; }
  .chip { border-radius:99px; padding:4px 11px; font-size:12px; }
  .chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .chip b { font-weight:600; margin-left:3px; }
  #search { width:100%; }
  .list { overflow-y:auto; flex:1; min-height:0; }
  .case { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0;
          padding:11px 14px 11px 16px; background:none; position:relative; }
  .case::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:transparent; }
  .case.p-crisis::before, .case.p-5::before, .case.p-4::before { background:var(--bad); }
  .case.p-3::before { background:var(--warn); }
  .case:hover { background:var(--panel-2); border-color:var(--line); }
  .case.sel { background:var(--accent-soft); }
  .case .who { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--dim); }
  .case .txt { margin:3px 0 7px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .case .row { gap:5px; }
  .empty { padding:28px 20px; color:var(--dim); }
  .empty h2 { font-size:16px; color:var(--fg); margin:0 0 6px; }
  .detail { overflow-y:auto; padding:22px clamp(16px, 3vw, 32px) 40px; min-width:0; }
  .detail-inner { max-width:880px; margin:0 auto; display:grid; gap:14px; }
  .back { display:none; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; min-width:0; }
  .card h3, .sub { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.07em;
                   color:var(--dim); font-weight:600; }
  .sub { margin:16px 0 6px; font-size:11px; }
  .case-head .meta { color:var(--dim); font-size:13px; margin-top:8px; }
  .complaint { margin:12px 0 0; font-size:17px; line-height:1.55; padding:12px 16px; border-left:3px solid var(--accent);
               background:var(--panel-2); border-radius:0 8px 8px 0; white-space:pre-wrap; }
  .summary { margin:10px 0 0; color:var(--dim); font-size:13px; }
  .callout { padding:10px 12px; border-radius:8px; font-size:13px; margin:0 0 12px; }
  .callout.warn { background:var(--warn-soft); color:var(--fg); border-left:3px solid var(--warn); }
  .callout.bad { background:var(--bad-soft); border-left:3px solid var(--bad); }
  .callout.ok { background:var(--ok-soft); border-left:3px solid var(--ok); }
  label.field { display:block; font-size:12px; color:var(--dim); margin-bottom:5px; font-weight:600; }
  textarea { width:100%; min-height:120px; background:var(--bg); color:var(--fg); border:1px solid var(--control);
             border-radius:8px; padding:11px 12px; font:inherit; font-size:14px; resize:vertical; }
  .decision.card { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .decide { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .reply { white-space:pre-wrap; margin:0; }
  .action { padding:12px 0; border-top:1px solid var(--line); }
  .action:first-child { border-top:0; padding-top:4px; }
  .action .what { font-weight:600; }
  .checks { font-size:12px; color:var(--dim); margin-top:4px; }
  .checks summary { cursor:pointer; }
  .checks div { padding:1px 0; }
  .approve { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:13px; font-weight:600;
             padding:8px 10px; border:1px dashed var(--line); border-radius:8px; }
  details.fold { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  details.fold > summary { cursor:pointer; padding:13px 18px; font-weight:600; list-style:none; display:flex;
                           justify-content:space-between; gap:10px; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::after { content:"Show"; color:var(--dim); font-weight:400; font-size:12px; }
  details.fold[open] > summary::after { content:"Hide"; }
  details.fold > summary small { color:var(--dim); font-weight:400; }
  details.fold > .body { padding:0 18px 16px; }
  .clause { font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
  .clause:last-child { border-bottom:0; }
  .clause b { color:var(--accent); font-family:var(--mono); font-weight:600; margin-right:6px; }
  .timeline { display:grid; gap:0; }
  .timeline div { display:grid; grid-template-columns:200px 1fr; gap:12px; padding:6px 0; border-bottom:1px solid var(--line);
                  font-size:13px; }
  .timeline div:last-child { border-bottom:0; }
  .timeline b { font-weight:600; }
  .timeline span { color:var(--dim); overflow-wrap:anywhere; }
  .cost { font-family:var(--mono); font-size:20px; color:var(--ok); }

  /* Toasts */
  #toasts { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:grid; gap:8px;
            z-index:30; max-width:min(420px, calc(100vw - 32px)); }
  .toast { background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:8px; font-size:13px;
           box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .toast.bad { background:var(--bad); color:#fff; }
  .toast.inline { display:flex; gap:8px; align-items:center; background:var(--panel); color:var(--fg); border:1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) { .toast { animation:rise .18s ease-out; } }
  @keyframes rise { from { transform:translateY(6px); opacity:0; } to { transform:none; opacity:1; } }

  /* Other views */
  /* Centre a 1240px column with padding, so every child lines up whatever its own margins. */
  .models { height:calc(100vh - 57px); overflow-y:auto; padding-block:22px 40px;
            padding-inline:max(clamp(16px, 3vw, 32px), calc((100% - 1240px) / 2)); }
  .models[hidden], .wrap[hidden] { display:none; }
  .models h2 { font-size:18px; margin:0 0 4px; }
  .models .card { margin-bottom:16px; overflow-x:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-bottom:16px; }
  .grid > .card { margin-bottom:0; }
  .score .big { font-family:var(--mono); font-size:26px; margin:2px 0 8px; }
  .score dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; font-size:12px; }
  .score dt { color:var(--dim); }
  .score dd { margin:0; font-family:var(--mono); text-align:right; }
  table.t { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  table.t th { text-align:right; color:var(--dim); font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.t td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.t th:first-child, table.t td:first-child { text-align:left; }
  table.t td.good { color:var(--ok); }
  table.t td.poor { color:var(--bad); }
  .cm td { min-width:34px; text-align:center !important; }
  .ex { padding:10px 0; border-top:1px solid var(--line); }
  .ex:first-of-type { border-top:0; }
  .ex .who { font-size:12px; color:var(--dim); }
  .ex .txt { margin:4px 0 6px; }
  .note { font-size:12px; color:var(--dim); margin:8px 0 0; }
  .bar { display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--line); margin:8px 0 4px; }
  .bar span { display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--mono);
              color:#04101f; white-space:nowrap; overflow:hidden; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--dim); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .rule { display:flex; gap:8px; font-size:13px; padding:3px 0; }
  .rule .mark { width:14px; flex:none; text-align:center; }
  .rule.pass .mark { color:var(--ok); } .rule.fail .mark { color:var(--bad); } .rule.off { color:var(--dim); }
  .scale { position:relative; height:8px; border-radius:4px; margin:14px 0 20px;
           background:linear-gradient(90deg, var(--bad) 0 35%, var(--warn) 35% 55%, var(--ok) 55% 100%); opacity:.85; }
  .scale b { position:absolute; top:-5px; width:3px; height:18px; background:var(--fg); border-radius:2px; }
  .scale em { position:absolute; top:12px; font-size:11px; color:var(--dim); font-style:normal; transform:translateX(-50%); white-space:nowrap; }
  .kpi { font-family:var(--mono); font-size:26px; }
  .kpi small { font-size:12px; color:var(--dim); }
  .hbar { display:grid; grid-template-columns:minmax(90px, 140px) 1fr 40px; gap:8px; align-items:center; font-size:13px; margin:4px 0; }
  .hbar div { height:10px; background:var(--accent); border-radius:3px; min-width:2px; }
  .hbar span:last-child { font-family:var(--mono); text-align:right; color:var(--dim); }
  input:not([type=checkbox]) { background:var(--bg); color:var(--fg); border:1px solid var(--control);
          border-radius:8px; padding:7px 10px; font:inherit; font-size:13px; min-width:0; }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--control); border-radius:6px; padding:4px 8px; font:inherit; font-size:12px; }


  /* Overview: a brand band with the one headline number, then data */
  .band { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
          background:var(--brand); color:var(--brand-ink); border-radius:14px; padding:22px 26px; margin-bottom:16px; }
  .band p { margin:6px 0 0; color:var(--brand-dim); }
  .band-kicker { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-dim); }
  .band-kicker::first-letter { color:var(--marigold); }
  .hero { font-size:56px; font-weight:650; line-height:1.05; margin-top:6px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .hero span { font-size:18px; font-weight:500; }
  .band-side { display:grid; gap:10px; justify-items:end; }
  .band-alert { background:var(--marigold); color:#1a1300; font-weight:600; font-size:13px; padding:4px 12px; border-radius:99px; }
  .band-cta { background:var(--brand-ink); color:var(--brand); border-color:transparent; font-weight:600; padding:9px 16px; }
  .band-cta:focus-visible { outline-color:var(--marigold); }
  .kpis .tile h3 { margin-bottom:6px; }
  .tile-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tile .kpi { font-family:var(--sans); font-weight:650; font-size:28px; }
  .spark { flex:none; }
  .meter { height:8px; border-radius:99px; background:var(--accent-soft); overflow:hidden; margin-top:10px; }
  .meter span { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .meter.ok { background:var(--ok-soft); } .meter.ok span { background:var(--ok); }
  .meter.warn { background:var(--warn-soft); } .meter.warn span { background:var(--warn); }
  .meter.bad { background:var(--bad-soft); } .meter.bad span { background:var(--bad); }
  .viz-grid { display:grid; grid-template-columns:minmax(0, 3fr) minmax(0, 2fr); gap:14px; margin-bottom:16px; }
  .viz-grid > .card { margin-bottom:0; }
  .chart-box { width:100%; min-height:230px; }
  .chart-box svg { display:block; max-width:100%; height:auto; }
  .chart-box .axis { fill:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .chart-box .endlabel { fill:var(--fg); font-size:12px; font-weight:600; }
  .legend i { border-radius:50%; }
  .table-view { margin-top:8px; font-size:12px; }
  .table-view summary { cursor:pointer; color:var(--dim); }
  .momentum { display:grid; gap:7px; }
  .mrow { display:grid; grid-template-columns:minmax(90px, 130px) 1fr 76px; gap:10px; align-items:center; font-size:13px; }
  .mtrack { display:flex; align-items:center; gap:6px; min-width:0; }
  .mbar { height:14px; background:var(--s1); border-radius:0 4px 4px 0; min-width:3px; }
  .mval { font-variant-numeric:tabular-nums; color:var(--fg); font-weight:600; }
  .delta { font-size:12px; white-space:nowrap; font-weight:600; text-align:right; }
  .delta.up { color:var(--bad); } .delta.down { color:var(--ok); } .delta.flat { color:var(--dim); font-weight:400; }
  #viz-tip { position:fixed; z-index:40; pointer-events:none; background:var(--panel); color:var(--fg);
             border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; display:grid; gap:3px;
             box-shadow:0 6px 18px rgba(0,0,0,.18); }
  #viz-tip[hidden] { display:none; }
  #viz-tip i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

  /* Narrow screens: queue and case stack; the header tabs scroll */
  @media (max-width: 900px) {
    header { padding:8px 12px; gap:8px; flex-wrap:wrap; }
    .tabs { order:3; flex-basis:100%; }
    .wrap { grid-template-columns:1fr; height:auto; min-height:calc(100vh - 96px); }
    .queue { border-right:0; }
    .wrap .detail { display:none; }
    .wrap.showing .queue { display:none; }
    .wrap.showing .detail { display:block; }
    .back { display:inline-block; margin-bottom:4px; justify-self:start; }
    .models { height:auto; }
    .timeline div { grid-template-columns:1fr; gap:2px; }
    .complaint { font-size:16px; }
    .sys-pop { width:min(300px, calc(100vw - 24px)); }
    .viz-grid { grid-template-columns:1fr; }
    .hero { font-size:44px; }
    .band-side { justify-items:start; }
    .wide-only { display:none; }
    #sys-label { max-width:34vw; overflow:hidden; text-overflow:ellipsis; }
    .sys-btn { padding:5px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>संवाद <span>Sanwaad</span></h1>
  <nav class="tabs" aria-label="Sections">
    <button id="tab-cases" class="on" onclick="show('cases')">Cases</button>
    <button id="tab-overview" onclick="show('overview')">Overview</button>
    <button id="tab-models" onclick="show('models')">Model comparison</button>
    <button id="tab-policy" onclick="show('policy')">Policy</button>
  </nav>
  <span class="spacer"></span>
  <div class="sys" id="sys">
    <button class="sys-btn" id="sys-btn" aria-expanded="false" aria-controls="sys-pop" onclick="toggleSys()">
      <span class="dot" id="sys-dot"></span><span id="sys-label">Checking…</span></button>
    <div class="sys-pop" id="sys-pop" hidden></div>
  </div>
  <button class="ghost" id="theme-btn" onclick="toggleTheme()" aria-label="Switch light or dark theme"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" style="vertical-align:-2px"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg><span class="wide-only"> Theme</span></button>
</header>

<div class="wrap" id="view-cases">
  <aside class="queue" aria-label="Case queue">
    <div class="qtools">
      <input id="search" type="search" placeholder="Search complaints, people, categories" oninput="renderList()"
             aria-label="Search cases">
      <div class="row" id="filters" role="group" aria-label="Filter cases"></div>
      <div class="row" style="justify-content:space-between">
        <span class="muted" id="qcount" style="font-size:12px"></span>
        <span class="row">
          <button class="ghost" onclick="load()" title="Reload the queue">Refresh</button>
          <button onclick="ingest()" id="sample-btn">Load sample complaints</button>
        </span>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="detail" id="detail" aria-live="polite">
    <div class="empty"><h2>Pick a complaint from the queue</h2>
      Cases waiting for your review are shown first, most urgent at the top. Use ↑ ↓ or J K to move through them.</div>
  </section>
</div>
<div class="models" id="view-overview" hidden></div>
<div class="models" id="view-models" hidden></div>
<div class="models" id="view-policy" hidden></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="viz-tip" role="tooltip" hidden></div>

<script>
let cases = [], selected = null, filter = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// --- Plain-language labels: one term per thing, used everywhere ----------------
const CATEGORY = {billing:"Billing & fees", refund:"Refund", service_outage:"Service outage", delivery:"Delivery",
  account_access:"Account access", agent_behaviour:"Staff behaviour", data_privacy:"Fraud & privacy",
  praise:"Praise", off_topic:"Not about us"};
const SEVERITY = {1:"Low", 2:"Minor", 3:"Moderate", 4:"High", 5:"Critical"};
const AUTHOR = {customer:"Customer", audience:"Large audience", troll:"Likely troll", bot:"Likely bot",
  competitor:"Competitor", unknown:"Unverified"};
const CHANNEL = {mock:"Sample feed", reddit:"Reddit", twitter:"X / Twitter", playstore:"Play Store"};
const STAGE = {triage:"Read and classified", pattern:"Checked for similar reports", judge:"Assessed the author",
  prioritise:"Placed in the queue", retrieve:"Found the relevant policy", draft:"Drafted a reply",
  ground_check:"Checked claims against policy", plan:"Planned the fix", review_gate:"Review",
  publish:"Posted the reply", act:"Carried out actions", escalation:"Decided on a callback",
  voice:"Callback", close:"Closed the case"};
const ACTION = {reversal:"Refund reversal", ticket:"Internal ticket"};
const RISK = {read:"Read-only", write_low:"Low risk", write_high:"Moves money: needs your approval"};
const STATUS = {
  needs_review: {label:"Needs your review", cls:"warn"},
  awaiting_call: {label:"Callback owed", cls:"info"},
  in_progress: {label:"In progress", cls:""},
  resolved: {label:"Resolved", cls:"ok"},
  closed_unresolved: {label:"Closed, unresolved", cls:"bad"},
  logged: {label:"Logged, no reply", cls:""},
};
const TIER = {crisis:"Incident", priority:"Priority", routine:"Routine", ignore:"Logged, no reply"};
const LEVEL = {SHADOW:"Watching only", ASSISTED:"Drafts for a person", SUPERVISED:"Acts, person can undo", AUTONOMOUS:"Acts on its own"};
const catLabel = c => CATEGORY[c] || (c ? String(c).replaceAll("_", " ") : "Not yet classified");
const sevPill = s => s ? `<span class="pill s${s}" title="Severity ${s} of 5">${SEVERITY[s] || s}</span>` : "";

function statusOf(c) {
  if (c.closure) {
    if ((c.priority || {}).tier === "ignore") return "logged";
    return c.closure.resolved ? "resolved" : "closed_unresolved";
  }
  if (c.draft && !c.review) return "needs_review";
  if (c.review && (c.escalation || {}).needed) return "awaiting_call";
  return "in_progress";
}
const statusPill = k => `<span class="pill ${STATUS[k].cls}">${STATUS[k].label}</span>`;

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return `${Math.floor(s / 86400)} d ago`;
}

// --- Toasts replace the old status text: say what happened, in words --------
function toast(message, kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.setAttribute("role", kind === "bad" ? "alert" : "status");
  el.textContent = message;
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), kind === "bad" ? 7000 : 4000);
}
const status = m => toast(m, /refused|failed|couldn/i.test(m) ? "bad" : "");

// --- Theme ------------------------------------------------------------------
function toggleTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("sanwaad-theme", r.dataset.theme); } catch {}
}
try { const t = localStorage.getItem("sanwaad-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

// --- System status: one pill, details on demand -----------------------------
function toggleSys(force) {
  const pop = document.getElementById("sys-pop");
  pop.hidden = force === undefined ? !pop.hidden : !force;
  document.getElementById("sys-btn").setAttribute("aria-expanded", String(!pop.hidden));
}
document.addEventListener("click", e => { if (!document.getElementById("sys").contains(e.target)) toggleSys(false); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("sys-pop").hidden) {
    toggleSys(false); document.getElementById("sys-btn").focus();
  }
});

async function health() {
  // /ready answers 503 while the index is warming, so the fetch must not
  // throw the answer away when it is the interesting one.
  let r;
  try { r = await (await fetch("/ready")).json(); } catch { return; }
  const dl = await (await fetch("/api/delivery")).json().catch(() => ({dead: []}));
  const problems = [], warnings = [];
  if (!r.ready) problems.push(`Policy index ${r.index}: replies can't be grounded yet`);
  for (const c of r.circuits || []) problems.push(`${c.tool} is failing and paused (${c.state})`);
  if ((dl.dead || []).length) problems.push(`${dl.dead.length} item(s) failed after retries`);
  for (const p of r.concurrency || []) if (p.running >= p.limit) warnings.push(`${p.pool} are at capacity`);
  if (r.triage && !r.triage.available) warnings.push(`Triage model ${r.triage.live} is unavailable; Gemini is covering`);
  const level = problems.length ? "bad" : warnings.length ? "warn" : "";
  document.getElementById("sys-dot").className = `dot ${level}`;
  document.getElementById("sys-label").textContent = problems.length ? `Needs attention (${problems.length})`
    : warnings.length ? "Running with warnings" : r.models === "offline" ? "Systems normal · demo mode" : "Systems normal";
  const pools = Object.fromEntries((r.concurrency || []).map(p => [p.pool, p]));
  document.getElementById("sys-pop").innerHTML = `
    ${[...problems.map(p => `<div class="callout bad">${esc(p)}</div>`), ...warnings.map(w => `<div class="callout warn">${esc(w)}</div>`)].join("")}
    <dl>
      <dt>Policy knowledge</dt><dd>${r.ready ? `${r.clauses} clauses loaded` : esc(r.index)}</dd>
      <dt>AI models</dt><dd>${r.models === "offline" ? "Offline demo (no API key)" : "Live"}</dd>
      <dt>Triage model</dt><dd>${esc(r.triage ? r.triage.live : "gemini")}</dd>
      <dt>Cases processing</dt><dd>${pools.cases ? `${pools.cases.running} of ${pools.cases.limit}` : "—"}</dd>
      <dt>Live calls</dt><dd>${pools.calls ? `${pools.calls.running} of ${pools.calls.limit}` : "—"}</dd>
      <dt>Voice callbacks</dt><dd>${String(r.voice || "").startsWith("ready") ? "Ready" : "Not set up"}</dd>
      <dt>Failed deliveries</dt><dd>${(dl.dead || []).length}</dd>
    </dl>`;
}

// --- Queue ------------------------------------------------------------------
const FILTERS = [["needs_review", "Needs review"], ["awaiting_call", "Callback owed"],
                 ["in_progress", "In progress"], ["closed", "Closed"], ["all", "All"]];
const inFilter = (c, f) => f === "all" ? true
  : f === "closed" ? ["resolved", "closed_unresolved", "logged"].includes(c._status) : c._status === f;

async function load() {
  health();
  let d;
  try { d = await (await fetch("/api/cases")).json(); }
  catch { toast("Couldn't load the queue. Check that the server is running, then press Refresh.", "bad"); return; }
  cases = d.cases.map(c => ({...c, _status: statusOf(c)}));
  const urgency = c => (c.pattern || {}).level === "crisis" ? 1000 : ((c.priority || {}).score || 0);
  cases.sort((a, b) => urgency(b) - urgency(a));
  if (!filter) filter = cases.some(c => c._status === "needs_review") ? "needs_review" : "all";
  renderList();
}

function renderList({focusSelected = false} = {}) {
  // Re-rendering replaces the row buttons, including on the 30-second refresh;
  // put focus back where a keyboard user had it instead of dropping it on the page.
  const active = document.activeElement;
  const hadFocus = focusSelected || !!(active && active.closest && active.closest("#list"));
  const focusedId = active && active.dataset ? active.dataset.id : null;
  document.getElementById("filters").innerHTML = FILTERS.map(([k, label]) => {
    const n = cases.filter(c => inFilter(c, k)).length;
    return `<button class="chip ${filter === k ? "on" : ""}" aria-pressed="${filter === k}"
      aria-label="${label}, ${n} case${n === 1 ? "" : "s"}" onclick="filter='${k}'; renderList()">${label} <b>${n}</b></button>`;
  }).join("");
  const q = document.getElementById("search").value.trim().toLowerCase();
  const shown = cases.filter(c => inFilter(c, filter)).filter(c => !q || [
    c.complaint?.text, c.complaint?.author, catLabel((c.triage || {}).category), STATUS[c._status].label
  ].join(" ").toLowerCase().includes(q));
  document.getElementById("qcount").textContent = cases.length
    ? `${shown.length} of ${cases.length} cases${q ? " match" : ""}` : "";
  const list = document.getElementById("list");
  if (!cases.length) {
    list.innerHTML = `<div class="empty"><h2>No complaints yet</h2>
      Connect a channel, or load sample complaints to see how cases flow through review.</div>`;
    return;
  }
  if (!shown.length) {
    list.innerHTML = `<div class="empty">Nothing here${q ? ` matches “${esc(q)}”` : ""}.
      ${filter !== "all" ? `<button class="ghost" onclick="filter='all'; renderList()">Show all cases</button>` : ""}</div>`;
    return;
  }
  list.innerHTML = shown.map(c => {
    const t = c.triage || {}, v = c.verdict || {}, p = c.pattern || {};
    const stripe = p.level === "crisis" ? "p-crisis" : `p-${t.severity || 0}`;
    return `<button class="case ${stripe} ${selected === c.case_id ? "sel" : ""}" data-id="${esc(c.case_id)}"
        aria-current="${selected === c.case_id}" onclick="open_('${esc(c.case_id)}')">
      <div class="who"><span>${esc(c.complaint?.author)} · ${esc(CHANNEL[c.complaint?.channel] || c.complaint?.channel)}</span>
        <span>${esc(ago(c.opened_at))}</span></div>
      <div class="txt">${esc(c.complaint?.text)}</div>
      <div class="row">
        ${statusPill(c._status)}
        ${p.level === "crisis" ? `<span class="pill bad">Incident · ${p.cluster_size} reports</span>` :
          p.level === "watch" ? `<span class="pill warn">Similar reports · ${p.cluster_size}</span>` : ""}
        ${sevPill(t.severity)}
        <span class="pill">${esc(catLabel(t.category))}</span>
        ${v.author_class && v.author_class !== "customer" ? `<span class="pill">${esc(AUTHOR[v.author_class] || v.author_class)}</span>` : ""}
        ${c.complaint && c.complaint.tagged === false ? '<span class="pill" title="Found without an @mention">Untagged</span>' : ""}
      </div>
    </button>`;
  }).join("");
  if (hadFocus) {
    const id = focusSelected ? selected : (focusedId || selected);
    document.querySelector(`#list .case[data-id="${CSS.escape(id || "")}"]`)?.focus({preventScroll: true});
  }
}

// Keyboard: ↑/↓ or J/K move through the queue, unless the reviewer is typing.
document.addEventListener("keydown", e => {
  if (view !== "cases" || e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const step = {ArrowDown: 1, j: 1, ArrowUp: -1, k: -1}[e.key];
  if (!step) return;
  const rows = [...document.querySelectorAll("#list .case")];
  if (!rows.length) return;
  e.preventDefault();
  const i = rows.findIndex(r => r.dataset.id === selected);
  const next = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + step))];
  open_(next.dataset.id);
});

function fold(title, body, {open = false, hint = ""} = {}) {
  return `<details class="fold" ${open ? "open" : ""}><summary><span>${title}
    ${hint ? `<small> · ${hint}</small>` : ""}</span></summary><div class="body">${body}</div></details>`;
}

function actionsHtml(s, awaitingReview) {
  return (s.actions || []).map(a => {
    const p = a.proposal, v = a.validation;
    const res = (s.action_results || []).find(r => r.action_id === p.id);
    const canApprove = awaitingReview && p.risk === "write_high" && v.ok;
    const passed = v.checks.filter(c => c.passed).length;
    return `<div class="action">
      <div class="row">
        <span class="what">${esc(ACTION[p.kind] || p.kind)}${p.amount_inr ? ` · ₹${Number(p.amount_inr).toLocaleString("en-IN")}` : ""}</span>
        ${p.reference ? `<code>${esc(p.reference)}</code>` : ""}
        <span class="pill ${v.ok ? "ok" : "bad"}">${v.ok ? "All checks passed" : "Blocked by checks"}</span>
        <span class="pill ${p.risk === "write_high" ? "warn" : ""}">${esc(RISK[p.risk] || p.risk)}</span>
        ${res ? `<span class="pill ${res.status === "executed" ? "ok" : "warn"}">${esc(res.status.replaceAll("_", " "))}</span>` : ""}
      </div>
      <div class="checks">${esc(p.reason)}
        <details><summary>${passed} of ${v.checks.length} checks passed</summary>
          ${v.checks.map(c => `<div>${c.passed ? "✓" : "✗"} ${esc(c.detail || c.name)}</div>`).join("")}
        </details></div>
      ${canApprove ? `<label class="approve"><input type="checkbox" class="act-approve" id="act-${esc(p.id)}"
         data-id="${esc(p.id)}"> Approve this ${esc((ACTION[p.kind] || p.kind).toLowerCase())}${p.amount_inr
         ? ` of ₹${Number(p.amount_inr).toLocaleString("en-IN")}` : ""}</label>` : ""}
      ${res && res.detail ? `<p class="checks" style="margin:6px 0 0">${esc(res.detail)}</p>` : ""}
    </div>`;
  }).join("");
}

async function open_(id) {
  selected = id;
  renderList({focusSelected: document.activeElement === document.body});
  document.getElementById("view-cases").classList.add("showing");
  let c;
  try { c = await (await fetch(`/api/cases/${id}`)).json(); }
  catch { toast("Couldn't open that case. Try again, or press Refresh.", "bad"); return; }
  if (selected !== id) return;                      // the reviewer moved on while it loaded
  const s = c.state, t = s.triage || {}, d = s.draft || {}, g = s.grounding || {};
  const v = s.verdict || {}, pat = s.pattern || {};
  const pending = c.pending || null;
  const awaitingVoice = pending && pending.await === "voice_call";
  const awaitingReview = pending && !awaitingVoice;
  const cl = s.closure;
  const listed = cases.find(x => x.case_id === id);
  const st = listed ? listed._status : (awaitingReview ? "needs_review" : "in_progress");
  const acts = actionsHtml(s, awaitingReview);

  const decision = awaitingReview ? `
    <div class="card decision"><h3>Your decision</h3>
      <div class="callout warn"><b>Held for you:</b> ${esc(pending.reason)}</div>
      ${(g.unsupported_claims || []).length ? `<div class="callout bad"><b>Not backed by policy:</b>
         ${g.unsupported_claims.map(esc).join(" · ")}. Edit these out before posting.</div>` : ""}
      <label class="field" for="draft">Reply to post publicly${t.language ? ` (in ${esc(t.language)})` : ""}</label>
      <textarea id="draft" oninput="draftChanged()">${esc(d.text)}</textarea>
      ${acts ? `<div class="sub">Actions in this case — money moves only if you tick it</div>${acts}` : ""}
      <div class="decide">
        <button class="primary" id="btn-approve" onclick="review('${id}','approve')">Approve and post</button>
        <button id="btn-edit" onclick="review('${id}','edit')" disabled
          title="Change the reply above to enable this">Post my edited reply</button>
        <button class="danger" id="btn-reject" onclick="rejectCase('${id}', this)">Reject reply</button>
      </div>
    </div>` : `
    <div class="card"><h3>${s.review ? "Reply" : "Draft reply"}</h3>
      ${s.review || d.text ? `<p class="reply">${esc((s.review || {}).final_text || d.text)}</p>` : '<p class="muted" style="margin:0">No reply drafted: this case was logged without one.</p>'}
      ${s.review ? `<p class="note">${s.review.decision === "reject" ? "Rejected" : s.review.auto ? "Posted automatically" : "Approved"}
        ${s.review.auto ? "" : `by ${esc(s.review.reviewer)}`}${s.review.note ? ` · ${esc(s.review.note)}` : ""}</p>` : ""}
      ${acts ? `<div class="sub">Actions</div>${acts}` : ""}
    </div>`;

  const voice = awaitingVoice ? `
    <div class="card"><h3>Callback owed</h3>
      <p style="margin:0 0 12px">${(s.escalation?.reasons || []).map(esc).join("<br>")}</p>
      <div class="row">
        <a href="/call/${esc(id)}" target="_blank" rel="noopener"><button class="primary">Start the callback</button></a>
        <button onclick="skipVoice('${id}')">Mark callback as skipped</button>
      </div>
    </div>` : "";

  const who = `
    <div class="row" style="margin-bottom:10px">
      <span class="pill">${esc(AUTHOR[v.author_class] || v.author_class || "Unknown")}</span>
      <span class="pill">Authenticity ${v.authenticity ?? "?"}</span>
      <span class="pill">Reach ${(v.reach ?? 0).toLocaleString()}</span>
      ${v.history_with_brand ? `<span class="pill">${v.history_with_brand} earlier case(s)</span>` : ""}
      ${v.reply_worthy === false ? '<span class="pill bad">Not answered publicly</span>' : ""}
      ${pat.level && pat.level !== "none" ? `<span class="pill ${pat.level === "crisis" ? "bad" : "warn"}">
        ${pat.level === "crisis" ? "Incident" : "Similar reports"} · ${pat.cluster_size} people · ${pat.velocity_per_hour}/hr</span>` : ""}
    </div>
    ${(v.evidence || []).length ? `<p class="note" style="margin:0">${esc(v.evidence.join(" · "))}</p>` : ""}
    ${pat.theme ? `<p class="note">Common theme: ${esc(pat.theme)}</p>` : ""}`;

  const clauses = (s.citations || []).slice(0, 8).map(c =>
    `<div class="clause"><b>${esc(c.clause_id)}</b>${esc(c.heading)}</div>`).join("");

  const closure = cl ? `
    <div class="cost">₹${cl.total_cost_inr.toFixed(4)}</div>
    <p class="note" style="margin:2px 0 12px">Model cost to handle this case · ${cl.llm_calls} AI calls · a person costs about ₹18–85</p>
    <div class="row">${cl.consistency.consistent ? '<span class="pill ok">Reply and call used the same policy</span>'
      : '<span class="pill bad">Reply and call used different policy</span>'}</div>
    <p class="note">Outcome: ${esc(cl.resolution_reason || (cl.resolved ? "resolved" : "unresolved"))}</p>` : "";

  const timeline = `<div class="timeline">${(s.events || []).map(e =>
    `<div><b>${esc(STAGE[e.stage] || e.stage)}</b><span>${esc(e.message)}</span></div>`).join("")}</div>`;

  document.getElementById("detail").innerHTML = `<div class="detail-inner">
    <h2 class="sr-only">Case from ${esc(s.complaint?.author)}</h2>
    <button class="back ghost" onclick="closeCase()">← Back to queue</button>
    <div class="card case-head">
      <div class="row">
        ${statusPill(st)}
        ${sevPill(t.severity)}
        <span class="pill">${esc(catLabel(t.category))}</span>
        ${pat.level === "crisis" ? `<span class="pill bad">Incident · ${pat.cluster_size} reports</span>` : ""}
        ${t.sentiment ? `<span class="pill">${esc(t.sentiment[0].toUpperCase() + t.sentiment.slice(1))}</span>` : ""}
        ${g.grounded === false ? '<span class="pill bad">Reply has unbacked claims</span>' : ""}
      </div>
      <div class="meta">${esc(s.complaint?.author)} · ${esc(CHANNEL[s.complaint?.channel] || s.complaint?.channel)}
        ${listed && listed.opened_at ? ` · opened ${esc(ago(listed.opened_at))}` : ""} · <code>${esc(id)}</code></div>
      <blockquote class="complaint">${esc(s.complaint?.text)}</blockquote>
      ${t.summary ? `<p class="summary"><b>Summary:</b> ${esc(t.summary)}</p>` : ""}
    </div>
    ${decision}
    ${voice}
    ${c.explain ? fold("Why this case is here", whyCard(c.explain), {open: awaitingReview, hint: "priority, author, review rules, callback"}) : ""}
    ${fold("Who is speaking", who, {hint: esc(AUTHOR[v.author_class] || "author")})}
    ${clauses ? fold("Policy behind the reply", clauses, {hint: `${(s.citations || []).length} clauses`}) : ""}
    ${closure ? fold("Outcome and cost", closure) : ""}
    ${fold("Activity", timeline, {hint: `${(s.events || []).length} steps`})}
  </div>`;
  document.getElementById("detail").scrollTop = 0;
}

function closeCase() {
  document.getElementById("view-cases").classList.remove("showing");
  const row = document.querySelector(`#list .case[data-id="${CSS.escape(selected || "")}"]`);
  if (row) row.focus();
}

function draftChanged() {
  const listedDraft = document.getElementById("draft").defaultValue;
  const edited = document.getElementById("draft").value.trim() !== listedDraft.trim();
  document.getElementById("btn-edit").disabled = !edited;
  document.getElementById("btn-approve").disabled = edited;
  document.getElementById("btn-approve").title = edited ? "You changed the reply: use Post my edited reply" : "";
}

function rejectCase(id, btn) {
  // Two-step, inside the page: rejecting sends nothing and closes the reply.
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed"); btn.textContent = "Confirm: reject reply";
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = "Reject reply"; } }, 5000);
    return;
  }
  review(id, "reject");
}

const DONE = {approve: "Reply approved and posted.", edit: "Your edited reply was posted.",
              reject: "Reply rejected. Nothing was posted."};

async function review(id, decision) {
  const ta = document.getElementById("draft");
  document.querySelectorAll(".decide button").forEach(b => b.disabled = true);
  try {
    const r = await fetch(`/api/cases/${id}/review`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({decision, final_text: ta ? ta.value : null, reviewer: "you",
        actions: Object.fromEntries([...document.querySelectorAll(".act-approve")]
          .map(cb => [cb.dataset.id, cb.checked ? "approve" : "reject"]))})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
    const approved = [...document.querySelectorAll(".act-approve:checked")].length;
    toast(DONE[decision] + (approved ? ` ${approved} money action(s) approved.` : ""));
  } catch (e) {
    toast(`Couldn't save your decision (${e.message}). Nothing was posted; try again.`, "bad");
    document.querySelectorAll(".decide button").forEach(b => b.disabled = false);
    return;
  }
  await load(); open_(id);
}

async function skipVoice(id) {
  try {
    const r = await fetch(`/api/cases/${id}/voice-outcome`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({happened: false, channel: "none", resolved: false, summary: "call skipped"})});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    toast("Callback marked as skipped. The case is closed as unresolved.");
  } catch (e) { toast(`Couldn't update the callback (${e.message}).`, "bad"); return; }
  await load(); open_(id);
}

async function ingest() {
  const btn = document.getElementById("sample-btn");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    const d = await (await fetch("/api/ingest", {method: "POST", headers: {"Content-Type": "application/json"},

// ---------------------------------------------------------------------------
// Model comparison — reads what `python -m sanwaad.evals.triage_compare` wrote
// ---------------------------------------------------------------------------

let view = "cases", comparison = null, cmBackend = null;

const VIEWS = ["cases", "overview", "models", "policy"];

function show(v) {
  view = v;
  for (const name of VIEWS) {
    document.getElementById(`view-${name}`).hidden = name !== v;
    document.getElementById(`tab-${name}`).classList.toggle("on", name === v);
  }
  refreshView();
}

function refreshView() {
  ({cases: load, overview: loadOverview, models: loadModels, policy: loadPolicy})[view]();
}

const pct = v => v == null ? "—" : `${(v * 100).toFixed(1)}%`;
const num = (v, d = 0) => v == null ? "—" : Number(v).toFixed(d);

async function loadModels() {
  health();
  const el = document.getElementById("view-models");
  let d;
  try { d = await (await fetch("/api/evals/triage")).json(); }
  catch { el.innerHTML = '<p class="muted">Could not reach /api/evals/triage.</p>'; return; }
  comparison = d;
  renderModels();
}

function statusCard(st) {
  return `<div class="card"><h3>Triage backends on this server</h3>
    <div class="row">${Object.entries(st.backends).map(([name, b]) =>
      `<span class="pill ${b.available ? 'ok' : ''}" title="${esc(b.detail)}">${esc(name)}${
        name === st.live ? ' · live' : ''}</span>`).join("")}</div>
    <p class="note">${Object.entries(st.backends).map(([n, b]) =>
      `<b>${esc(n)}</b>: ${esc(b.detail)}`).join("<br>")}</p>
    <p class="note">Live triage uses <code>SANWAAD_TRIAGE_BACKEND=${esc(st.live)}</code>. A decision
      model whose category confidence is below <code>SANWAAD_TRIAGE_MIN_CONFIDENCE=${esc(st.min_confidence)}</code>
      hands that comment to Gemini, and the case timeline says so.</p>
  </div>`;
}

function renderModels() {
  const el = document.getElementById("view-models");
  const d = comparison, r = d.result;
  if (!r) {
    el.innerHTML = `<h2>Model comparison</h2>
      <p class="muted" style="margin:0 0 16px">No comparison has been run yet.</p>
      <div class="card"><h3>Run one on your own complaints</h3>
        <p style="margin:0 0 8px">A CSV with a <code>text</code> column and a <code>category</code> column
          (<code>id</code> and <code>channel</code> optional). Start from
          <code>sanwaad/evals/data/triage_template.csv</code>.</p>
        <p style="margin:0"><code>python -m sanwaad.evals.triage_compare --data your_complaints.csv</code></p>
        <p class="note">Then press Refresh. Example texts are redacted before they are saved.</p>
      </div>
      ${d.error ? `<p style="color:var(--bad)">${esc(d.error)}</p>` : ""}
      ${statusCard(d.status)}`;
    return;
  }

  const bs = r.backends;
  const best = (f, lower) => {
    const vals = bs.map(f).filter(v => v != null);
    if (!vals.length) return null;
    return lower ? Math.min(...vals) : Math.max(...vals);
  };
  const topAcc = best(b => b.category.accuracy), topF1 = best(b => b.category.macro_f1);
  const fastest = best(b => b.latency_ms.p50, true), cheapest = best(b => b.cost_inr.per_1k, true);
  if (!cmBackend || !bs.find(b => b.backend === cmBackend)) cmBackend = bs[0]?.backend;

  const classes = Object.keys(r.dataset.class_counts);
  const when = new Date(r.generated_at).toLocaleString();

  el.innerHTML = `
    <h2>Model comparison — triage category</h2>
    <p class="muted" style="margin:0 0 16px">${esc(r.dataset.name)} · ${r.dataset.rows} comments,
      ${r.dataset.labelled} labelled · run ${esc(when)}</p>

    ${bs.length ? `<div class="grid">${bs.map(b => {
      const tags = [];
      if (b.category.accuracy != null && b.category.accuracy === topAcc) tags.push("most accurate");
      if (b.category.macro_f1 != null && b.category.macro_f1 === topF1 && bs.length > 1) tags.push("best macro-F1");
      if (b.latency_ms.p50 === fastest && bs.length > 1) tags.push("fastest");
      if (b.cost_inr.per_1k === cheapest && bs.length > 1) tags.push("cheapest");
      const offline = Object.keys(b.models).some(m => m === "offline" || m === "degraded");
      return `<div class="card score"><h3>${esc(b.backend)}</h3>
        <div class="big">${pct(b.category.accuracy)}</div>
        <div class="row" style="margin-bottom:10px">${tags.map(t => `<span class="pill ok">${t}</span>`).join("")}
          ${offline ? '<span class="pill s3" title="No API key: these are the keyword stub\'s answers">offline stub</span>' : ''}</div>
        <dl>
          <dt>macro-F1</dt><dd>${num(b.category.macro_f1, 3)}</dd>
          <dt>calibration error</dt><dd>${b.calibration.reports_confidence ? num(b.calibration.ece, 3) : "no confidence"}</dd>
          <dt>latency p50 / p95</dt><dd>${num(b.latency_ms.p50)} / ${num(b.latency_ms.p95)} ms</dd>
          <dt>cost per 1,000</dt><dd>₹${num(b.cost_inr.per_1k, 2)}</dd>
          <dt>scored</dt><dd>${b.category.n} of ${b.rows_run}</dd>
          ${b.error_count ? `<dt style="color:var(--bad)">failed rows</dt><dd style="color:var(--bad)">${b.error_count}</dd>` : ""}
        </dl>
        <p class="note">${Object.entries(b.models).map(([m, n]) => `${esc(m)} × ${n}`).join(" · ")}</p>
      </div>`;
    }).join("")}</div>` : '<p class="muted">No backend could run.</p>'}

    ${r.skipped.length ? `<div class="card"><h3>Not run</h3>${r.skipped.map(s =>
      `<div class="clause"><b>${esc(s.backend)}</b> ${esc(s.reason)}</div>`).join("")}</div>` : ""}

    ${bs.length && classes.length ? `<div class="card"><h3>Recall by category — how many of each it caught</h3>
      <table class="t"><tr><th>category</th><th>support</th>${bs.map(b =>
        `<th>${esc(b.backend)} recall</th><th>precision</th>`).join("")}</tr>
      ${classes.map(c => `<tr><td>${esc(catLabel(c))}</td><td>${r.dataset.class_counts[c]}</td>${bs.map(b => {
        const pc = b.category.per_class[c] || {};
        const cls = pc.recall == null ? "" : pc.recall >= 0.8 ? "good" : pc.recall < 0.5 ? "poor" : "";
        return `<td class="${cls}">${pct(pc.recall)}</td><td>${pct(pc.precision)}</td>`;
      }).join("")}</tr>`).join("")}
      </table>
      <p class="note">A model can score well overall by never predicting a rare category. Low recall on
        <code>data_privacy</code> or <code>account_access</code> matters most: those always escalate.</p>
    </div>` : ""}

    ${bs.some(b => b.calibration.reports_confidence) ? `<div class="card">
      <h3>If we only trust confident answers</h3>
      <table class="t"><tr><th>backend</th><th>min confidence</th><th>handles</th><th>accuracy on those</th></tr>
      ${bs.filter(b => b.calibration.reports_confidence).map(b => b.calibration.selective.map((s, i) =>
        `<tr><td>${i ? "" : esc(b.backend)}</td><td>${s.threshold.toFixed(2)}</td>
          <td>${pct(s.coverage)}</td><td>${pct(s.accuracy)}</td></tr>`).join("")).join("")}
      </table>
      <p class="note">"Handles" is the share of comments the decision model triages on its own; the rest
        go to Gemini. Pick the lowest threshold whose accuracy you accept and set it as
        <code>SANWAAD_TRIAGE_MIN_CONFIDENCE</code>.</p>
    </div>` : ""}

    ${bs.length && classes.length ? `<div class="card">
      <h3>What gets mixed up —
        <select onchange="cmBackend=this.value; renderModels()">${bs.map(b =>
          `<option ${b.backend === cmBackend ? "selected" : ""}>${esc(b.backend)}</option>`).join("")}</select></h3>
      ${confusion(bs.find(b => b.backend === cmBackend))}
      <p class="note">Rows are the correct label, columns what the model said. Off-diagonal cells are mistakes.</p>
    </div>` : ""}

    ${r.agreement.length ? `<div class="card"><h3>Agreement on fields nobody labelled</h3>
      <table class="t"><tr><th>pair</th><th>n</th><th>severity</th><th>severity ±1</th>
        <th>sentiment</th><th>is complaint</th><th>needs private data</th></tr>
      ${r.agreement.map(a => `<tr><td>${esc(a.a)} vs ${esc(a.b)}</td><td>${a.n}</td>
        <td>${pct(a.severity)}</td><td>${pct(a.severity_within_1)}</td><td>${pct(a.sentiment)}</td>
        <td>${pct(a.is_complaint)}</td><td>${pct(a.needs_private_data)}</td></tr>`).join("")}
      </table>
      <p class="note">Agreement, not accuracy: two models can agree and both be wrong. Label severity in the
        CSV to score it properly.</p>
    </div>` : ""}

    ${r.examples.length ? `<div class="card"><h3>Where they went wrong or disagreed (${r.examples.length})</h3>
      ${r.examples.map(x => `<div class="ex">
        <div class="who">${esc(x.id)}${x.gold ? ` · correct: <b>${esc(x.gold)}</b>` : " · unlabelled"}</div>
        <div class="txt">${esc(x.text)}</div>
        <div class="row">${Object.entries(x.predictions).map(([n, p]) => {
          const wrong = x.gold && p.category !== x.gold;
          return `<span class="pill ${wrong ? 'wrong' : x.gold ? 'ok' : ''}">${esc(n)}: ${esc(p.category)}${
            p.confidence != null ? ` ${(p.confidence * 100).toFixed(0)}%` : ""} · sev ${p.severity}</span>`;
        }).join("")}</div>
      </div>`).join("")}
    </div>` : ""}

    ${statusCard(d.status)}`;
}

// ---------------------------------------------------------------------------
// Why a case is where it is — every line comes from the code that decided it
// ---------------------------------------------------------------------------

const PART_COLOURS = {severity:"#f0616d", authenticity:"#3ecf8e", reach:"#5b9dff",
                      pattern:"#f0b429", history:"#b39dff"};

function ruleRow(ok, text, detail, off) {
  const cls = off ? "off" : ok ? "pass" : "fail";
  return `<div class="rule ${cls}"><span class="mark">${off ? "·" : ok ? "✓" : "✗"}</span>
    <span><b>${esc(text)}</b>${detail ? ` <span class="muted">— ${esc(detail)}</span>` : ""}</span></div>`;
}

function whyCard(x) {
  if (!x) return "";
  const p = x.priority, a = x.author, rv = x.review, esc_ = x.escalation;
  const parts = Object.entries(p.components || {}).filter(([, v]) => v > 0);
  const total = parts.reduce((s, [, v]) => s + v, 0) || 1;
  const pos = v => `${Math.max(0, Math.min(1, v ?? 0)) * 100}%`;

  let review = "";
  if (rv) {
    const then = rv.at_the_time;
    const drift = then && then.allowed !== rv.allowed_now;
    // Every hard rule is evaluated, so a second failure is real and shown; the
    // first one is the reason the gate gave.
    const first = rv.checks.findIndex(c => !c.passed);
    review = `<div class="sub">Review gate — could it post without a person?</div>
      ${rv.checks.map((c, i) => ruleRow(c.passed, c.rule + (i === first ? " (reason given)" : ""),
        c.passed ? (c.kind === "hard" ? "" : c.detail) : c.detail)).join("")}
      <p class="note">${then ? `At the time: <b>${then.allowed ? "posted on its own" : "held for a person"}</b>
        (${esc(then.reason || "")}).` : ""}
        ${drift ? ` <span style="color:var(--warn)">Evaluated now it would ${rv.allowed_now ? "post" : "be held"}:
        earned autonomy has changed since.</span>` : ""}</p>`;
  }

  return `<div>
    <div class="sub">Queue priority — ${esc(p.tier || "?")}, score ${p.score ?? "?"}</div>
    <div class="bar">${parts.map(([k, v]) =>
      `<span style="width:${v / total * 100}%;background:${PART_COLOURS[k] || "#888"}"
        title="${esc(k)} ${v}">${v / total > 0.12 ? `${esc(k)} ${v}` : ""}</span>`).join("")}</div>
    <div class="legend">${parts.map(([k, v]) =>
      `<span><i style="background:${PART_COLOURS[k] || "#888"}"></i>${esc(k)} ${v}</span>`).join("")}</div>
    <p class="note">${esc(p.formula)}${p.recomputed ? " · itemised from the stored inputs" : ""}</p>
    ${(p.reasons || []).length ? `<p class="note">Tier because: ${p.reasons.map(esc).join(" · ")}</p>` : ""}

    <div class="sub">Author — ${esc(a.class || "?")}, authenticity ${a.authenticity ?? "?"}</div>
    <div class="scale"><b style="left:${pos(a.authenticity)}"></b>
      <em style="left:${pos(a.bands.troll_at_or_below)}">troll ≤ ${a.bands.troll_at_or_below}</em>
      <em style="left:${pos(a.bands.audience_at_or_above)}">audience ≥ ${a.bands.audience_at_or_above}</em></div>
    <p class="note">${(a.evidence || []).length ? a.evidence.map(esc).join(" · ") : "no author evidence recorded"}.
      Answered if authenticity ≥ ${a.bands.answer_if_authenticity_at_least} or reach ≥
      ${Number(a.bands.or_reach_at_least).toLocaleString()} (reach here ${Number(a.reach ?? 0).toLocaleString()}).</p>

    ${review}

    ${esc_ ? `<div class="sub">Voice callback triggers (clause ESC-02)</div>
      ${esc_.checks.map(c => ruleRow(c.fired, c.rule, c.fired ? c.detail : "", !c.fired)).join("")}
      <p class="note">${esc_.checks.some(c => c.fired) ? "Any one trigger offers a call." : "No trigger fired, so no call is offered."}</p>` : ""}
  </div>`;
}

// Overview
